openapi: 3.0.3
info:
  title: MJBJ · Buscador del panel
  version: "1"
  description: |
    Una caja que busca en todo el panel: clientes, pedidos, presupuestos,
    comprobantes, cortes y proveedores, hasta cuatro de cada uno, y solo de
    las pantallas a las que entra el rol de quien busca.
paths:
  /api/v1/admin/buscar:
    get:
      operationId: BuscarEnElPanel
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
          description: Lo encontrado, agrupado por tipo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, tipo, titulo, detalle, href]
                  properties:
                    id: { type: string }
                    tipo: { type: string }
                    titulo: { type: string }
                    detalle: { type: string }
                    href: { type: string }
        "401": { $ref: "#/components/responses/Problema" }
components:
  responses:
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
  schemas:
    Problema:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores: { type: object, additionalProperties: { type: string } }
