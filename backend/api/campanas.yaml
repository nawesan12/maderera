openapi: 3.0.3
info:
  title: MJBJ · Campañas, bajas y avisos
  version: "1"
  description: |
    Las campañas de correo (armar, segmentar, mandar por tandas, programar,
    cancelar), la baja con el enlace firmado de cada correo (la página /baja
    pregunta acá; la baja con un clic de RFC 8058 es POST /api/baja, fuera de
    este contrato, con la dirección de siempre), la pantalla de avisos
    automáticos por correo y los avisos al teléfono del panel.
    Campañas y avisos: solo el admin (ACCESO de /admin/campanas y
    /admin/avisos). Los avisos al teléfono: cualquier persona del panel.
paths:
  /api/v1/admin/campanas:
    get:
      operationId: ListarCampanas
      responses:
        "200":
          description: Las últimas 200, de la más nueva a la más vieja
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CampanaResumen" } }
    post:
      operationId: GuardarCampana
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormularioLibre" }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/campanas/estado:
    get:
      operationId: EstadoDeCampanas
      responses:
        "200":
          description: Si pueden salir, a cuántas por minuto y cuántas bajas hay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampanasEstado" }
  /api/v1/admin/campanas/alcance:
    post:
      operationId: AlcanceDelSegmento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormularioLibre" }
      responses:
        "200":
          description: A cuántas direcciones llega el segmento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlcanceDeCampana" }
  /api/v1/admin/campanas/vista-previa:
    post:
      operationId: VistaPreviaDeCampana
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormularioLibre" }
      responses:
        "200":
          description: El correo tal cual va a llegar
          content:
            application/json:
              schema:
                type: object
                required: [html]
                properties:
                  html: { type: string }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/campanas/prueba:
    post:
      operationId: EnviarPruebaDeCampana
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormularioLibre" }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/campanas/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: ObtenerCampana
      responses:
        "200":
          description: La campaña, con sus conteos y el correo de muestra
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampanaDetalle" }
        "404": { $ref: "#/components/responses/Problema" }
    delete:
      operationId: EliminarBorradorDeCampana
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/campanas/{id}/fallidos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: FallidosDeCampana
      responses:
        "200":
          description: Los que no salieron, con el motivo
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EnvioFallido" } }
  /api/v1/admin/campanas/{id}/envio:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: EnviarCampana
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
    delete:
      operationId: CancelarEnvioDeCampana
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/campanas/{id}/programacion:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: ProgramarCampana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuando]
              additionalProperties: false
              properties:
                cuando: { type: string, description: "Lo del datetime-local, en hora de Buenos Aires" }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
    delete:
      operationId: DesprogramarCampana
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
  /api/v1/admin/campanas/{id}/copia:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: DuplicarCampana
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/bajas:
    get:
      operationId: LeerBaja
      parameters:
        - { name: e, in: query, schema: { type: string, maxLength: 1000 } }
        - { name: t, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: La dirección del enlace (null si no es auténtico) y si ya se dio de baja
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BajaDelEnlace" }
    post:
      operationId: ConfirmarBaja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [e, t, recibir]
              additionalProperties: false
              properties:
                e: { type: string, maxLength: 1000 }
                t: { type: string, maxLength: 200 }
                recibir: { type: boolean, description: "true: volver a recibir; false: darse de baja" }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mi-cuenta/novedades:
    get:
      operationId: MisNovedades
      description: Si quien entró recibe las campañas (por la dirección de su ficha, o la de su cuenta)
      responses:
        "200":
          description: Si las recibe
          content:
            application/json:
              schema:
                type: object
                required: [recibe]
                properties:
                  recibe: { type: boolean }
        "401": { $ref: "#/components/responses/Problema" }
    put:
      operationId: CambiarMisNovedades
      description: Se aplica a la dirección de la cuenta y a la de la ficha, si son distintas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recibir]
              additionalProperties: false
              properties:
                recibir: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "401": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/avisos:
    get:
      operationId: ListarAvisosEmail
      responses:
        "200":
          description: Los avisos por correo (sembrados), en el orden del ciclo de un pedido
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AvisoEmailConfig" } }
  /api/v1/admin/avisos/correo:
    get:
      operationId: EstadoDelCorreo
      responses:
        "200":
          description: Si los correos salen y por dónde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoDelCorreo" }
  /api/v1/admin/avisos/enviados:
    get:
      operationId: AvisosEnviados
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 40 } }
      responses:
        "200":
          description: Los últimos avisos de todos los canales
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AvisoRegistrado" } }
  /api/v1/admin/avisos/activo:
    put:
      operationId: CambiarAvisoEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormularioLibre" }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/avisos/texto:
    put:
      operationId: GuardarTextoAvisoEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormularioLibre" }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/push:
    get:
      operationId: ClaveDePush
      responses:
        "200":
          description: La clave pública para suscribirse, y si el push está configurado
          content:
            application/json:
              schema:
                type: object
                required: [clave, configurado]
                properties:
                  clave: { type: string, nullable: true }
                  configurado: { type: boolean }
    post:
      operationId: ActivarPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, p256dh, auth]
              additionalProperties: false
              properties:
                endpoint: { type: string, maxLength: 2000 }
                p256dh: { type: string, maxLength: 500 }
                auth: { type: string, maxLength: 500 }
                descripcion: { type: string, maxLength: 300 }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
    delete:
      operationId: DesactivarPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              additionalProperties: false
              properties:
                endpoint: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
  /api/v1/admin/push/prueba:
    post:
      operationId: ProbarPush
      responses:
        "200": { $ref: "#/components/responses/OkConId" }
        "422": { $ref: "#/components/responses/Problema" }
components:
  responses:
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    OkConId:
      description: Hecho, con el mensaje para la pantalla
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: string }
              id: { type: string }
  schemas:
    Problema:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores: { type: object, additionalProperties: { type: string } }
    FormularioLibre:
      type: object
      description: Lo del formulario tal como lo mandó la pantalla; Go lo valida como zod
      additionalProperties: true
    SegmentoCampana:
      type: object
      required: [tipo, rubros, actividad]
      properties:
        tipo: { type: string, enum: [todos, particular, profesional] }
        rubros: { type: array, items: { type: string } }
        actividad:
          type: object
          nullable: true
          required: [tipo, meses]
          properties:
            tipo: { type: string, enum: [compraron, sinComprar] }
            meses: { type: integer }
    CampanaResumen:
      type: object
      required: [id, asunto, adelanto, cuerpo, imagenUrl, botonTexto, botonUrl, segmento, descripcion, estado, programadaPara,
        creadaPorUserId, creadaPorNombre, iniciadaAt, terminadaAt, createdAt, updatedAt, total, enviados, fallidos, omitidos, pendientes]
      properties:
        id: { type: string }
        asunto: { type: string }
        adelanto: { type: string, nullable: true }
        cuerpo: { type: string }
        imagenUrl: { type: string, nullable: true }
        botonTexto: { type: string, nullable: true }
        botonUrl: { type: string, nullable: true }
        segmento: { $ref: "#/components/schemas/SegmentoCampana" }
        descripcion: { type: string, description: "El segmento en castellano" }
        estado: { type: string, enum: [borrador, programada, enviando, enviada, cancelada] }
        programadaPara: { type: string, format: date-time, nullable: true }
        creadaPorUserId: { type: string, nullable: true }
        creadaPorNombre: { type: string, nullable: true }
        iniciadaAt: { type: string, format: date-time, nullable: true }
        terminadaAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        total: { type: integer }
        enviados: { type: integer }
        fallidos: { type: integer }
        omitidos: { type: integer }
        pendientes: { type: integer }
    CampanaDetalle:
      allOf:
        - { $ref: "#/components/schemas/CampanaResumen" }
        - type: object
          required: [muestra]
          properties:
            muestra: { type: string, description: "El HTML del correo, armado para cliente@ejemplo.com" }
    CampanasEstado:
      type: object
      required: [real, porMinuto, bajas, motivo]
      properties:
        real: { type: boolean, description: "Si el envío de correos está conectado" }
        porMinuto: { type: integer }
        bajas: { type: integer }
        motivo: { type: string, nullable: true, description: "Por qué no podría salir ahora, o null" }
    AlcanceDeCampana:
      type: object
      required: [cantidad, descripcion, porMinuto]
      properties:
        cantidad: { type: integer }
        descripcion: { type: string }
        porMinuto: { type: integer }
    EnvioFallido:
      type: object
      required: [email, nombre, error]
      properties:
        email: { type: string }
        nombre: { type: string, nullable: true }
        error: { type: string, nullable: true }
    BajaDelEnlace:
      type: object
      required: [email, dadoDeBaja]
      properties:
        email: { type: string, nullable: true }
        dadoDeBaja: { type: boolean }
    AvisoEmailConfig:
      type: object
      required: [id, evento, asunto, encabezado, activo]
      properties:
        id: { type: string }
        evento: { type: string }
        asunto: { type: string }
        encabezado: { type: string, nullable: true }
        activo: { type: boolean }
    EstadoDelCorreo:
      type: object
      required: [enVivo, remitente, detalle]
      properties:
        enVivo: { type: boolean }
        remitente: { type: string }
        detalle: { type: string }
    AvisoRegistrado:
      type: object
      required: [id, canal, evento, destinatario, asunto, estado, error, createdAt]
      properties:
        id: { type: string }
        canal: { type: string }
        evento: { type: string }
        destinatario: { type: string }
        asunto: { type: string, nullable: true }
        estado: { type: string }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
