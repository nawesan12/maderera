openapi: 3.0.3
info:
  title: MJBJ · Clientes y cuenta corriente
  version: "1"
  description: |
    La cartera de clientes, su cuenta corriente, los cobros con recibo, los
    cheques, los vendedores y el seguimiento de cobranza; y la cuenta
    corriente que ve el cliente en el portal. Cada cobro pasa por
    EmitirRecibo (la única puerta para la plata de un cliente). Cada ruta
    pide la pantalla que la usa: clientes, vendedores y seguimiento, quien
    entra a /admin/clientes; los cheques, /admin/cheques, y su cartera,
    /admin/compras/pagos; cobrar, /admin/pedidos (se cobra también desde la
    ficha del pedido); un recibo, quien entra a /admin/pedidos. Anular,
    cargar cheques, movimientos a mano, bloqueo y plazo: solo el admin. El resumen y el recibo los puede pedir
    también el servidor de Next con el secreto interno (los PDF y los avisos).
paths:
  /api/v1/admin/clientes:
    get:
      operationId: ListarClientes
      parameters:
        - { name: busqueda, in: query, schema: { type: string, maxLength: 200 } }
        - { name: tipo, in: query, schema: { type: string } }
        - { name: rubro, in: query, schema: { type: string } }
        - { name: vendedor, in: query, schema: { type: string } }
        - { name: pagina, in: query, description: la de «Al día», desde 1, schema: { type: integer, minimum: 1, maximum: 100000 } }
        - { name: cobrar, in: query, description: la de «Por cobrar», desde 1 (de a 30, del más urgente al menos), schema: { type: integer, minimum: 1, maximum: 100000 } }
      responses:
        "200":
          description: Los activos en dos grupos, con los totales de todos los que pasan el filtro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarteraDeClientes" }
    post:
      operationId: GuardarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormCliente" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/clientes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: FichaDeCliente
      responses:
        "200":
          description: La ficha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FichaDeCliente" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/clientes/{id}/historial:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: HistorialDeCliente
      parameters:
        - { name: periodo, in: query, schema: { type: string, enum: ["3m", "6m", "12m", todo] } }
        - { name: filtro, in: query, schema: { $ref: "#/components/schemas/Filtro" } }
      responses:
        "200":
          description: Los movimientos, del más nuevo al más viejo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Historial" }
  /api/v1/admin/clientes/{id}/resumen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: ResumenDeCuenta
      responses:
        "200":
          description: El resumen para imprimir
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumenDeCuenta" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/clientes/{id}/credito:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: CreditoDeCliente
      parameters:
        - { name: monto, in: query, schema: { type: number, format: double, default: 0 } }
      responses:
        "200":
          description: Si puede comprar a cuenta, y por qué no
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credito" }
  /api/v1/admin/clientes/{id}/movimientos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: RegistrarMovimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, monto]
              additionalProperties: false
              properties:
                tipo: { type: string }
                monto: { type: string }
                detalle: { type: string }
                fecha: { type: string, description: "AAAA-MM-DD, si es de otro día; vacío es hoy" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/clientes/{id}/cuenta-web:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: VincularCuentaWeb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuentaWebId]
              additionalProperties: false
              properties:
                cuentaWebId: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/clientes/{id}/invitacion:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: InvitarAlPortal
      description: |
        Le abre la cuenta web a un cliente cargado en el panel, con el correo
        de la ficha, y le manda el link de activación (M2S1-097).
      responses:
        "200":
          description: Lo que pasó y el link, para mandarlo también por WhatsApp
          content:
            application/json:
              schema:
                type: object
                required: [ok, url]
                properties:
                  ok: { type: string }
                  url: { type: string }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/clientes/{id}/bloqueo:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: BloquearCuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bloquear]
              additionalProperties: false
              properties:
                bloquear: { type: boolean }
                motivo: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/clientes/{id}/plazo:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: CambiarPlazo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dias]
              additionalProperties: false
              properties:
                dias: { type: number, format: double }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/clientes/{id}/cobros:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: CobrarACliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partes]
              additionalProperties: false
              properties:
                orderId: { type: string }
                concepto: { type: string }
                partes: { type: string, description: "el JSON de las partes, como lo arma el formulario" }
                branchId: { type: string, description: "la sucursal donde entra el efectivo (sin caja abierta se pide abrirla)" }
                clave: { type: string, maxLength: 64, description: "la del intento, generada al abrir el cobro: un reintento devuelve el mismo recibo" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/cobros/caja:
    get:
      operationId: CajaDelCobroACuenta
      summary: Si el efectivo de un cobro a cuenta (sin pedido) tiene caja abierta; sin caja, cuál abrir o entre cuáles elegir (lo mismo que contestaría el cobro)
      responses:
        "200":
          description: Vacío si hay caja
          content:
            application/json:
              schema:
                type: object
                properties:
                  sinCaja: { type: string, description: la sucursal cuya caja hay que abrir }
                  fondoBase: { type: number, format: double }
                  sucursales:
                    type: array
                    items:
                      type: object
                      required: [id, nombre, abierta, fondo]
                      properties:
                        id: { type: string }
                        nombre: { type: string }
                        abierta: { type: boolean }
                        fondo: { type: number, format: double }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/recibos/{id}/anular:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: AnularRecibo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              additionalProperties: false
              properties:
                motivo: { type: string }
                pin: { type: string, maxLength: 12, description: "el de un admin, para quien no es admin (como anular una venta)" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/recibos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: ReciboCompleto
      description: El personal, el cliente dueño o el servidor de Next.
      responses:
        "200":
          description: El recibo con sus partes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recibo" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/recibos/{id}/pdf:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: ReciboPdf
      description: El recibo en PDF. El personal, o el cliente dueño (a otro se le contesta 404).
      responses:
        "200":
          description: El PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/cuentas/{id}/pdf:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: ResumenDeCuentaPdf
      description: El resumen de cuenta corriente en PDF. El personal, o el cliente de esa cuenta.
      responses:
        "200":
          description: El PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/retenciones-sufridas:
    post:
      operationId: CargarRetencionSufrida
      description: Un certificado de retención que nos entregó un cliente. Baja su deuda con un recibo. Solo el admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                customerId: { type: string }
                numero: { type: string }
                impuesto: { type: string }
                codigoRegimen: { type: string }
                base: { type: string }
                alicuota: { type: string }
                importe: { type: string }
                fecha: { type: string }
                referencia: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/cheques:
    get:
      operationId: ListarCheques
      parameters:
        - { name: estado, in: query, description: Un estado, «vivos» (los que todavía mueven plata) o «todos», schema: { type: string } }
        - { name: sentido, in: query, schema: { type: string } }
      responses:
        "200":
          description: Los vivos primero, por fecha de pago
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChequeListado" } }
    post:
      operationId: CargarCheque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sentido: { type: string }
                tipo: { type: string }
                numero: { type: string }
                banco: { type: string }
                librador: { type: string }
                fechaPago: { type: string }
                importe: { type: string }
                customerId: { type: string }
                circuito: { type: string }
                notas: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/cheques/terminados:
    get:
      operationId: ChequesTerminados
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: desplazamiento, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Los acreditados, rechazados y anulados, lo último que cambió primero, con el total para paginar
          content:
            application/json:
              schema:
                type: object
                required: [filas, total]
                properties:
                  filas: { type: array, items: { $ref: "#/components/schemas/ChequeListado" } }
                  total: { type: integer }
  /api/v1/admin/cheques/cartera:
    get:
      operationId: ChequesEnCartera
      responses:
        "200":
          description: Los recibidos que están en la cartera
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, numero, banco, fechaPago, importe, tipo, cliente, circuito]
                  properties:
                    id: { type: string }
                    numero: { type: string }
                    banco: { type: string, nullable: true }
                    fechaPago: { type: string, format: date-time }
                    importe: { type: number, format: double }
                    tipo: { type: string }
                    cliente: { type: string, nullable: true }
                    circuito: { type: string, enum: [blanco, negro] }
                    esperaCae: { type: boolean, description: de una venta con su factura esperando el CAE }
                    trabado: { type: boolean, description: espera el CAE y la regla endoso_espera_cae no deja endosarlo }
  /api/v1/admin/cheques/{id}/estado:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: CambiarEstadoDeCheque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              additionalProperties: false
              properties:
                estado: { type: string }
                motivo: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/cheques/{id}/rechazo:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: RechazarChequeDelCliente
      description: >-
        El banco rechazó un cheque que entregó un cliente: lo registra quien
        maneja plata desde la ficha del cliente (H272), con el PIN de un admin
        si no es admin. Hace lo mismo que pasarlo a rechazado en
        /admin/cheques (la nota de débito y el aviso).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              additionalProperties: false
              properties:
                motivo: { type: string }
                pin: { type: string, maxLength: 64, description: "el de un admin (o su contraseña, sin ningún PIN cargado)" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/vendedores:
    get:
      operationId: ListarVendedores
      parameters:
        - { name: activos, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Por nombre, con cuántos clientes tiene cada uno
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nombre, tipo, activo, clientes]
                  properties:
                    id: { type: string }
                    nombre: { type: string }
                    tipo: { type: string, enum: [salon, calle] }
                    activo: { type: boolean }
                    clientes: { type: integer }
    post:
      operationId: GuardarVendedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              additionalProperties: false
              properties:
                id: { type: string }
                nombre: { type: string }
                tipo: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/vendedores/{id}/alternar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: AlternarVendedor
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/personal:
    get:
      operationId: ListarPersonal
      responses:
        "200":
          description: El personal, por puesto y nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nombre, correo, rol]
                  properties:
                    id: { type: string }
                    nombre: { type: string }
                    correo: { type: string }
                    rol: { $ref: "#/components/schemas/Puesto" }
    post:
      operationId: AltaDePersonal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, rol]
              additionalProperties: false
              properties:
                nombre: { type: string, maxLength: 120 }
                correo: { type: string, maxLength: 200 }
                rol: { $ref: "#/components/schemas/Puesto" }
                clave: { type: string, maxLength: 200, description: La contraseña inicial; sin ella, la persona la elige con el link del alta }
      responses:
        "200":
          description: Dado de alta; sin clave, con el link para elegirla (también va a su correo)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: string }
                  enlace: { type: string }
                  nombre: { type: string }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/personal/{id}/puesto:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      operationId: CambiarPuesto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              additionalProperties: false
              properties:
                rol: { $ref: "#/components/schemas/Puesto" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/personal/{id}/baja:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      operationId: BajaDePersonal
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/seguimiento:
    get:
      operationId: ListarGestiones
      parameters:
        - { name: cerradas, in: query, schema: { type: boolean, default: false } }
        - { name: cliente, in: query, schema: { type: string } }
      responses:
        "200":
          description: La próxima acción más cercana primero
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Gestion" } }
    post:
      operationId: CrearGestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                customerId: { type: string }
                asunto: { type: string }
                notas: { type: string }
                proximaAccion: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/seguimiento/vencidas:
    get:
      operationId: GestionesVencidas
      responses:
        "200":
          description: Cuántas abiertas tienen la próxima acción vencida
          content:
            application/json:
              schema: { type: object, required: [cuantas], properties: { cuantas: { type: integer } } }
  /api/v1/admin/seguimiento/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: MoverGestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etapa]
              additionalProperties: false
              properties:
                etapa: { type: string }
                nota: { type: string }
                proximaAccion: { type: string }
      responses:
        "200":
          description: Movido; el cliente, para refrescar su ficha
          content:
            application/json:
              schema: { type: object, required: [ok, customerId], properties: { ok: { type: string }, customerId: { type: string } } }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/cuenta/corriente:
    get:
      operationId: MiCuentaCorriente
      responses:
        "200":
          description: La cuenta del cliente de la sesión (vacía si no tiene ficha)
          content:
            application/json:
              schema:
                type: object
                required: [saldo, limiteCredito, disponible, movimientos, sinEntregar]
                properties:
                  saldo: { type: number, format: double }
                  limiteCredito: { type: number, format: double }
                  disponible: { type: number, format: double }
                  sinEntregar: { type: number, format: double }
                  movimientos: { type: array, items: { $ref: "#/components/schemas/MovimientoDelResumen" } }
        "401": { $ref: "#/components/responses/Problema" }
  /api/v1/cuenta/movimientos:
    get:
      operationId: MisMovimientos
      parameters:
        - { name: periodo, in: query, schema: { type: string, enum: ["3m", "6m", "12m", todo] } }
        - { name: filtro, in: query, schema: { $ref: "#/components/schemas/Filtro" } }
      responses:
        "200":
          description: El historial del cliente de la sesión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Historial" }
        "401": { $ref: "#/components/responses/Problema" }
  /api/v1/cuenta/credito:
    get:
      operationId: MiCredito
      parameters:
        - { name: monto, in: query, schema: { type: number, format: double, default: 0 } }
      responses:
        "200":
          description: Si puede pagar esta compra con la cuenta corriente
          content:
            application/json:
              schema:
                type: object
                required: [habilitado, saldo, limiteCredito, disponible, motivo]
                properties:
                  habilitado: { type: boolean }
                  saldo: { type: number, format: double }
                  limiteCredito: { type: number, format: double }
                  disponible: { type: number, format: double }
                  soloSaldoAFavor: { type: boolean }
                  motivo: { type: string, nullable: true }
components:
  responses:
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    Ok:
      description: Hecho, con el mensaje para la pantalla
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: string }
              aviso: { type: string }
              receiptId: { type: string }
              id: { type: string, description: "la ficha guardada (el alta abre la ficha nueva)" }
  schemas:
    Puesto:
      type: string
      enum: [admin, vendedor, deposito, aserradero]
    Problema:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores: { type: object, additionalProperties: { type: string } }
    Filtro: { type: string, enum: [todo, compras, pagos, cheques, ajustes] }
    FormCliente:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        id: { type: string }
        nombre: { type: string }
        razonSocial: { type: string }
        cuit: { type: string }
        condicionIva: { type: string }
        tipo: { type: string }
        email: { type: string }
        telefono: { type: string }
        direccion: { type: string }
        rubro: { type: string }
        asesor: { type: string }
        sellerId: { type: string }
        limiteCredito: { type: string }
        priceListId: { type: string }
        notas: { type: string }
    Prioridad:
      type: object
      required: [urgencia, puntaje, diasVencida]
      properties:
        urgencia: { type: string }
        puntaje: { type: number, format: double }
        diasVencida: { type: integer }
    CarteraDeClientes:
      type: object
      required: [porCobrar, alDia, totalAlDia, cantidadDeudores, deudaTotal, vencidoTotal]
      properties:
        porCobrar:
          description: los que deben, del más urgente al menos
          type: array
          items: { $ref: "#/components/schemas/ClienteListado" }
        alDia:
          description: una página de los que no deben, por nombre
          type: array
          items: { $ref: "#/components/schemas/ClienteListado" }
        totalAlDia: { type: integer }
        cantidadDeudores: { type: integer }
        deudaTotal: { type: number, format: double }
        vencidoTotal: { type: number, format: double }
    ClienteListado:
      type: object
      required: [id, nombre, razonSocial, cuit, rubro, tipo, estado, asesor, telefono, email, saldo, limiteCredito, diasCredito,
        cuentaBloqueada, motivoBloqueo, totalComprado, ultimaCompra, deuda]
      properties:
        id: { type: string }
        nombre: { type: string }
        razonSocial: { type: string, nullable: true }
        cuit: { type: string, nullable: true }
        rubro: { type: string, nullable: true }
        tipo: { type: string, enum: [particular, profesional] }
        estado: { type: string, enum: [activo, moroso, inactivo] }
        asesor: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        email: { type: string, nullable: true }
        saldo: { type: number, format: double }
        limiteCredito: { type: number, format: double }
        diasCredito: { type: integer }
        cuentaBloqueada: { type: boolean }
        motivoBloqueo: { type: string, nullable: true }
        totalComprado: { type: number, format: double }
        ultimaCompra: { type: string, format: date-time, nullable: true }
        deuda:
          type: object
          nullable: true
          description: lo vencido y la prioridad de cobranza, solo de quien debe
          required: [vencido, diasDeLaMasVieja, prioridad]
          properties:
            vencido: { type: number, format: double }
            diasDeLaMasVieja: { type: integer, nullable: true }
            prioridad: { $ref: "#/components/schemas/Prioridad" }
    Comprobante:
      type: object
      required: [id, numero, estado, total, createdAt]
      properties:
        id: { type: string }
        numero: { type: string }
        estado: { type: string }
        total: { type: string }
        createdAt: { type: string, format: date-time }
    FichaDeCliente:
      type: object
      required: [id, userId, nombre, razonSocial, cuit, condicionIva, email, telefono, direccion, rubro, tipo, estado, priceListId,
        limiteCredito, asesor, notas, active, createdAt, updatedAt, codigoLegacy, sellerId, diasCredito, cuentaBloqueada,
        motivoBloqueo, vendedor, cuentaWebSinVincular, saldo, pedidos, presupuestos, cortes, facturas, anterior]
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        nombre: { type: string }
        razonSocial: { type: string, nullable: true }
        cuit: { type: string, nullable: true }
        condicionIva: { type: string, enum: [responsable_inscripto, monotributista, exento, consumidor_final, no_categorizado] }
        email: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        direccion: { type: string, nullable: true }
        rubro: { type: string, nullable: true }
        tipo: { type: string, enum: [particular, profesional] }
        estado: { type: string, enum: [activo, moroso, inactivo] }
        priceListId: { type: string, nullable: true }
        limiteCredito: { type: string }
        asesor: { type: string, nullable: true }
        notas: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        codigoLegacy: { type: string, nullable: true }
        sellerId: { type: string, nullable: true }
        diasCredito: { type: integer }
        cuentaBloqueada: { type: boolean }
        motivoBloqueo: { type: string, nullable: true }
        vendedor: { type: string, nullable: true }
        cuentaWebSinVincular:
          type: object
          nullable: true
          required: [id, nombre, createdAt]
          properties:
            id: { type: string }
            nombre: { type: string }
            createdAt: { type: string, format: date-time }
        saldo: { type: number, format: double }
        pedidos: { type: array, items: { $ref: "#/components/schemas/Comprobante" } }
        presupuestos: { type: array, items: { $ref: "#/components/schemas/Comprobante" } }
        cortes: { type: array, items: { $ref: "#/components/schemas/Comprobante" }, description: En total van las placas }
        facturas: { type: array, items: { $ref: "#/components/schemas/Comprobante" } }
        anterior: { $ref: "#/components/schemas/HistorialAnterior" }
    HistorialAnterior:
      description: >-
        Lo que la migración trajo del sistema anterior (ISIS) para este cliente:
        las últimas 20 ventas y los últimos 20 comprobantes, con los totales de
        todo.
      type: object
      required: [ventas, comprobantes, cantidadVentas, totalVentas, cantidadComprobantes, totalComprobantes]
      properties:
        cantidadVentas: { type: integer }
        totalVentas: { type: string }
        cantidadComprobantes: { type: integer }
        totalComprobantes: { type: string }
        ventas:
          type: array
          items:
            type: object
            required: [id, comprobante, fecha, total, detalle, sucursal]
            properties:
              id: { type: string }
              comprobante: { type: string }
              fecha: { type: string, format: date-time }
              total: { type: string }
              detalle: { type: string }
              sucursal: { type: string, nullable: true }
        comprobantes:
          type: array
          items:
            type: object
            required: [id, tipo, puntoVenta, numero, fecha, total, cae]
            properties:
              id: { type: string }
              tipo: { type: string }
              puntoVenta: { type: integer }
              numero: { type: integer }
              fecha: { type: string, format: date-time }
              total: { type: string }
              cae: { type: string, nullable: true }
    MovimientoDelCliente:
      type: object
      required: [id, fecha, clase, titulo, detalle, importe, importeInformativo, pedido, recibo]
      properties:
        id: { type: string }
        fecha: { type: string, format: date-time }
        clase:
          type: string
          enum: [compra, pago, nota_credito, nota_debito, ajuste, compra_contado, pago_en_revision, pago_rechazado, cheque_por_recibir, cheque, cheque_rechazado, cheque_no_tomado]
        titulo: { type: string }
        detalle: { type: string, nullable: true }
        importe: { type: number, format: double, nullable: true }
        importeInformativo: { type: number, format: double, nullable: true }
        pedido:
          type: object
          nullable: true
          required: [id, numero]
          properties: { id: { type: string }, numero: { type: string } }
        recibo:
          type: object
          nullable: true
          required: [id, numero, anulado, porMercadoPago]
          properties: { id: { type: string }, numero: { type: string }, anulado: { type: boolean },
            porMercadoPago: { type: boolean, description: Una parte es un cobro de Mercado Pago aprobado; no se anula desde el panel },
            chequeRechazado: { type: boolean },
            chequeDevuelto: { type: boolean, description: el cheque que volvió estaba en la cartera y se le devolvió al cliente } }
        cheques:
          type: array
          description: Los cheques del renglón que el banco todavía puede rechazar (H272)
          items:
            type: object
            required: [id, nombre, importe, devolver]
            properties:
              id: { type: string }
              nombre: { type: string }
              importe: { type: number, format: double }
              devolver: { type: boolean, description: En la cartera y sin vencer, se devuelve al cliente }
    Historial:
      type: object
      required: [movimientos, hayMas, saldo]
      properties:
        movimientos: { type: array, items: { $ref: "#/components/schemas/MovimientoDelCliente" } }
        hayMas: { type: boolean }
        saldo: { type: number, format: double }
    MovimientoDelResumen:
      type: object
      required: [id, fecha, tipo, detalle, referencia, receiptId, monto, saldo]
      properties:
        id: { type: string }
        fecha: { type: string, format: date-time }
        tipo: { type: string }
        detalle: { type: string, nullable: true }
        referencia: { type: string, nullable: true }
        receiptId: { type: string, nullable: true }
        reciboNumero: { type: string, nullable: true }
        monto: { type: number, format: double }
        saldo: { type: number, format: double }
    Tramo:
      type: object
      required: [etiqueta, desde, hasta, monto]
      properties:
        etiqueta: { type: string }
        desde: { type: integer }
        hasta: { type: integer, nullable: true }
        monto: { type: number, format: double }
    ResumenDeCuenta:
      type: object
      required: [cliente, movimientos, saldo, aging]
      properties:
        cliente:
          type: object
          required: [id, nombre, razonSocial, cuit, direccion, limiteCredito]
          properties:
            id: { type: string }
            nombre: { type: string }
            razonSocial: { type: string, nullable: true }
            cuit: { type: string, nullable: true }
            direccion: { type: string, nullable: true }
            limiteCredito: { type: number, format: double }
        movimientos: { type: array, items: { $ref: "#/components/schemas/MovimientoDelResumen" } }
        saldo: { type: number, format: double }
        aging:
          type: object
          required: [tramos, total, aFavor, diasDeLaMasVieja]
          properties:
            tramos: { type: array, items: { $ref: "#/components/schemas/Tramo" } }
            total: { type: number, format: double }
            aFavor: { type: number, format: double }
            diasDeLaMasVieja: { type: integer, nullable: true }
    Credito:
      type: object
      required: [puede, saldo, limiteCredito, disponible, diasDeLaMasVieja, motivo, autorizable]
      properties:
        puede: { type: boolean }
        saldo: { type: number, format: double }
        limiteCredito: { type: number, format: double }
        disponible: { type: number, format: double }
        diasDeLaMasVieja: { type: integer, nullable: true }
        motivo: { type: string, nullable: true }
        autorizable: { type: boolean }
        soloSaldoAFavor: { type: boolean }
    Recibo:
      type: object
      required: [id, numero, fecha, estado, origen, concepto, total, recibidoDe, motivoAnulacion, anuladoAt, cliente, partes,
        saldoDespues, emitidoPor]
      properties:
        id: { type: string }
        numero: { type: string }
        fecha: { type: string, format: date-time }
        estado: { type: string, enum: [emitido, anulado] }
        origen: { type: string }
        concepto: { type: string, nullable: true }
        total: { type: number, format: double }
        recibidoDe: { type: string }
        motivoAnulacion: { type: string, nullable: true }
        anuladoAt: { type: string, format: date-time, nullable: true }
        cliente:
          type: object
          nullable: true
          required: [id, cuit, direccion]
          properties:
            id: { type: string }
            cuit: { type: string, nullable: true }
            direccion: { type: string, nullable: true }
        partes:
          type: array
          items:
            type: object
            required: [medio, importe, referencia, cheque]
            properties:
              medio: { type: string, enum: [efectivo, transferencia, deposito, cheque, echeq, tarjeta_debito, tarjeta_credito, mercado_pago, retencion] }
              importe: { type: number, format: double }
              referencia: { type: string, nullable: true }
              cheque:
                type: object
                nullable: true
                required: [id, tipo, numero, banco, librador, fechaPago, estado]
                properties:
                  id: { type: string }
                  tipo: { type: string, enum: [fisico, echeq] }
                  numero: { type: string }
                  banco: { type: string, nullable: true }
                  librador: { type: string, nullable: true }
                  fechaPago: { type: string, format: date-time }
                  estado: { type: string }
        saldoDespues: { type: number, format: double, nullable: true }
        emitidoPor: { type: string, nullable: true }
    ChequeListado:
      type: object
      required: [id, sentido, tipo, numero, banco, librador, fechaPago, importe, estado, cliente, customerId, circuito, proveedor, proveedorId,
        notas, receiptId, recibo, motivoRechazo, saldoCliente]
      properties:
        id: { type: string }
        sentido: { type: string, enum: [recibido, entregado] }
        tipo: { type: string, enum: [fisico, echeq] }
        numero: { type: string }
        banco: { type: string, nullable: true }
        librador: { type: string, nullable: true }
        fechaPago: { type: string, format: date-time }
        importe: { type: number, format: double }
        estado: { type: string }
        cliente: { type: string, nullable: true }
        customerId: { type: string, nullable: true }
        circuito: { type: string }
        proveedor: { type: string, nullable: true }
        proveedorId: { type: string, nullable: true }
        notas: { type: string, nullable: true }
        receiptId: { type: string, nullable: true }
        recibo: { type: string, nullable: true }
        motivoRechazo: { type: string, nullable: true }
        saldoCliente: { type: number, format: double, nullable: true, description: lo que debe hoy el cliente (solo en los informados) }
        noAceptado: { type: boolean, description: rechazado sin haberse aceptado (era informado) }
        devuelto: { type: boolean, description: rechazado desde la cartera, devuelto al cliente }
        esperaCae: { type: boolean, description: de una venta con su factura esperando el CAE }
        clienteRazonSocial: { type: string, nullable: true, description: la razón social del cliente, para reconocer al librador }
    Gestion:
      type: object
      required: [id, customerId, cliente, etapa, asunto, notas, proximaAccionAt, vencida, paraHoy, createdAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        cliente: { type: string }
        etapa: { type: string, enum: [pendiente, hablando, promesa, cerrado] }
        asunto: { type: string }
        notas: { type: string, nullable: true }
        proximaAccionAt: { type: string, format: date-time, nullable: true }
        vencida: { type: boolean, description: "la próxima acción es de un día argentino que ya pasó" }
        paraHoy: { type: boolean, description: "la próxima acción es de hoy (día argentino)" }
        createdAt: { type: string, format: date-time }
        saldo: { type: number, format: double, description: "lo que debe el cliente en la cuenta (positivo, debe)" }
