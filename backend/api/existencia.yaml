openapi: 3.0.3
info:
  title: MJBJ · Existencia
  version: "1"
  description: |
    «¿Existe esto?», para las páginas públicas que Next guarda en caché. Solo
    con el secreto interno: abierto dejaría recorrer los números de pedido.
paths:
  /api/v1/interno/existe:
    get:
      operationId: Existe
      parameters:
        - name: que
          in: query
          required: true
          schema:
            type: string
            enum: [pedido-por-numero, pago-demo, remito-por-token, comprobante, remito, cliente, corte, pedido]
        - { name: clave, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Si existe
          content:
            application/json:
              schema: { type: object, required: [existe], properties: { existe: { type: boolean } } }
        "403": { $ref: "#/components/responses/Problema" }
components:
  responses:
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
  schemas:
    Problema:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores: { type: object, additionalProperties: { type: string } }
