openapi: 3.0.3
info:
  title: MJBJ · Migración
  version: "1"
  description: |
    La migración de datos del sistema anterior (ISIS ERP Manager): leer el
    archivo, proponer el mapeo de columnas, la vista previa, y la corrida por
    lotes de 200 filas, cada uno en su transacción y repetible (volver a
    subir el archivo actualiza, no duplica). Al cerrar, el informe de
    integridad contra la base.

    Los errores que se muestran tal cual en la pantalla vienen en `error`
    con 200, como los devolvían las acciones.

    Permisos: leer el estado y el historial, cualquier persona del panel;
    todo lo demás, el admin (quien entra a /admin/migracion).
paths:
  /api/v1/admin/migracion/entidades:
    get:
      operationId: EntidadesDeMigracion
      responses:
        "200":
          description: Las siete entidades, con sus campos, y el tamaño del lote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinicionesDeMigracion" }
  /api/v1/admin/migracion/estado:
    get:
      operationId: EstadoDeMigracion
      responses:
        "200":
          description: Lo que ya hay cargado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoDeMigracion" }
  /api/v1/admin/migracion/corridas:
    get:
      operationId: HistorialDeMigraciones
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
      responses:
        "200":
          description: Las últimas corridas, de la más nueva a la más vieja
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CorridaDeMigracion" } }
    post:
      operationId: IniciarCorrida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entidad, archivo, codificacion, mapeo, filasTotales]
              additionalProperties: false
              properties:
                entidad: { $ref: "#/components/schemas/ClaveEntidad" }
                archivo: { type: string, maxLength: 500 }
                codificacion: { type: string, maxLength: 200 }
                mapeo: { $ref: "#/components/schemas/MapeoDeColumnas" }
                filasTotales: { type: integer, minimum: 0 }
      responses:
        "200":
          description: La corrida abierta
          content:
            application/json:
              schema:
                type: object
                required: [runId]
                properties:
                  runId: { type: string }
  /api/v1/admin/migracion/analizar:
    post:
      operationId: AnalizarArchivo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [entidad]
              properties:
                entidad: { $ref: "#/components/schemas/ClaveEntidad" }
                archivo: { type: string, format: binary }
      responses:
        "200":
          description: El archivo leído y el mapeo propuesto, o por qué no se pudo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivoAnalizado" }
  /api/v1/admin/migracion/previa:
    post:
      operationId: PrevisualizarMigracion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilasDeMigracion" }
      responses:
        "200":
          description: Qué entra, qué entra con reparos y qué queda afuera
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VistaPreviaDeMigracion" }
  /api/v1/admin/migracion/corridas/{id}/lote:
    post:
      operationId: EjecutarLote
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilasDeMigracion" }
      responses:
        "200":
          description: Lo que dejó el lote, sumado a la corrida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoteDeMigracion" }
  /api/v1/admin/migracion/corridas/{id}/cerrar:
    post:
      operationId: CerrarCorrida
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilasDeMigracion" }
      responses:
        "200":
          description: El informe de integridad
          content:
            application/json:
              schema:
                type: object
                required: [controles]
                properties:
                  controles: { type: array, items: { $ref: "#/components/schemas/ControlDeMigracion" } }
components:
  responses:
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
  schemas:
    Problema:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores: { type: object, additionalProperties: { type: string } }
    ClaveEntidad:
      type: string
      enum: [clientes, productos, stock, saldos, proveedores, ventas_historicas, comprobantes_historicos]
    MapeoDeColumnas:
      description: El índice de columna de cada campo; -1 es «no está en el archivo».
      type: object
      additionalProperties: { type: integer, minimum: -1 }
    OpcionDeCampo:
      type: object
      required: [valor, etiqueta, alias]
      properties:
        valor: { type: string }
        etiqueta: { type: string }
        alias: { type: array, items: { type: string } }
    CampoDeMigracion:
      type: object
      required: [clave, etiqueta, tipo, alias]
      properties:
        clave: { type: string }
        etiqueta: { type: string }
        tipo: { type: string, enum: [texto, numero, entero, cuit, email, opcion, fecha] }
        requerido: { type: boolean }
        ayuda: { type: string }
        opciones: { type: array, items: { $ref: "#/components/schemas/OpcionDeCampo" } }
        porDefecto: { type: string }
        alias: { type: array, items: { type: string } }
    EntidadDeMigracion:
      type: object
      required: [clave, titulo, resumen, escribe, identidad, campos]
      properties:
        clave: { $ref: "#/components/schemas/ClaveEntidad" }
        titulo: { type: string }
        resumen: { type: string }
        escribe: { type: string }
        identidad: { type: string }
        campos: { type: array, items: { $ref: "#/components/schemas/CampoDeMigracion" } }
    DefinicionesDeMigracion:
      type: object
      required: [lote, entidades]
      properties:
        lote: { type: integer }
        entidades: { type: array, items: { $ref: "#/components/schemas/EntidadDeMigracion" } }
    EstadoDeMigracion:
      type: object
      required: [clientes, clientesMigrados, medidas, conExistencia, saldosMigrados]
      properties:
        clientes: { type: integer }
        clientesMigrados: { type: integer }
        medidas: { type: integer }
        conExistencia: { type: integer }
        saldosMigrados: { type: integer }
    RechazoDeMigracion:
      type: object
      required: [linea, identificador, motivo]
      properties:
        linea: { type: integer }
        identificador: { type: string }
        motivo: { type: string }
    CorridaDeMigracion:
      type: object
      required: [id, entidad, archivo, estado, filasTotales, creados, actualizados, omitidos, conError, rechazos, createdAt, finishedAt]
      properties:
        id: { type: string }
        entidad: { $ref: "#/components/schemas/ClaveEntidad" }
        archivo: { type: string }
        estado: { type: string, enum: [en_curso, completada, interrumpida] }
        filasTotales: { type: integer }
        creados: { type: integer }
        actualizados: { type: integer }
        omitidos: { type: integer }
        conError: { type: integer }
        rechazos: { type: array, items: { $ref: "#/components/schemas/RechazoDeMigracion" } }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    ArchivoAnalizado:
      type: object
      properties:
        error: { type: string }
        archivo: { type: string }
        columnas: { type: array, items: { type: string } }
        filas: { type: array, items: { type: array, items: { type: string } } }
        codificacion: { type: string }
        mapeo: { $ref: "#/components/schemas/MapeoDeColumnas" }
    FilasDeMigracion:
      type: object
      required: [entidad, mapeo, filas]
      additionalProperties: false
      properties:
        entidad: { $ref: "#/components/schemas/ClaveEntidad" }
        mapeo: { $ref: "#/components/schemas/MapeoDeColumnas" }
        filas:
          type: array
          maxItems: 100000
          items: { type: array, items: { type: string } }
    FilaPreviaDeMigracion:
      type: object
      required: [linea, identificador, resumen, errores, avisos]
      properties:
        linea: { type: integer }
        identificador: { type: string }
        resumen: { type: string }
        errores: { type: array, items: { type: string } }
        avisos: { type: array, items: { type: string } }
    VistaPreviaDeMigracion:
      type: object
      properties:
        error: { type: string }
        validas: { type: integer }
        conAviso: { type: integer }
        conError: { type: integer }
        muestra: { type: array, items: { $ref: "#/components/schemas/FilaPreviaDeMigracion" } }
        rechazos: { type: array, items: { $ref: "#/components/schemas/RechazoDeMigracion" } }
    LoteDeMigracion:
      type: object
      properties:
        error: { type: string }
        creados: { type: integer }
        actualizados: { type: integer }
        omitidos: { type: integer }
        conError: { type: integer }
        rechazos: { type: array, items: { $ref: "#/components/schemas/RechazoDeMigracion" } }
    ControlDeMigracion:
      type: object
      required: [titulo, detalle, segunElArchivo, enElSistema, ok]
      properties:
        titulo: { type: string }
        detalle: { type: string }
        segunElArchivo: { type: string }
        enElSistema: { type: string }
        ok: { type: boolean }
