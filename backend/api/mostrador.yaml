openapi: 3.0.3
info:
  title: MJBJ · Mostrador
  version: "1"
  description: |
    El punto de venta: cobrar (la única función que registra una venta de
    mostrador, repetible por su clave), anular, la caja del turno, el
    buscador, el alta rápida de clientes, el presupuesto y el cobro de la
    cuenta corriente en el mostrador, y la descarga de las ventas hechas sin
    conexión. Lo pide el servidor de Next con la cookie de quien atiende:
    quien entra a /mostrador (admin y vendedor; hasta el 30/10/2026 era
    cualquier persona del panel, como las acciones de app/mostrador). Las
    rutas de siempre de la copia local (/api/mostrador/latido, catalogo,
    clientes, caja/movimientos y caja/vincular) no están en este contrato: las
    atiende Go con su forma de siempre (internal/mostrador/offline.go).
paths:
  /api/v1/mostrador/pantalla:
    get:
      operationId: PantallaDelMostrador
      parameters:
        - { name: sucursal, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: El turno, sus movimientos y su cierre Z, las ventas de hoy, la lista general y el fondo de cambio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MostradorPantalla" }
  /api/v1/mostrador/ventas:
    post:
      operationId: CobrarVenta
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: "la venta, como la valida el ventaSchema de la acción" }
      responses:
        "200":
          description: La venta hecha (o la que ya estaba con esa clave), o el motivo por el que no se hizo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MostradorResultadoVenta" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/descarga:
    post:
      operationId: DescargarVentas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuerpo]
              additionalProperties: false
              properties:
                cuerpo: { nullable: true, description: "el cuerpo de POST /api/mostrador/ventas tal cual llegó (null si no era JSON)" }
      responses:
        "200":
          description: Lo que pasó con cada venta, en orden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MostradorDescarga" }
        "400":
          description: El cuerpo no tiene la forma de la cola (zod)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MostradorErrorDeCola" }
  /api/v1/mostrador/ventas/{id}/anular:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: AnularVentaDeMostrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              additionalProperties: false
              properties:
                motivo: { type: string }
                volvioLaMercaderia: { type: boolean, default: true, description: "false: el cliente se la llevó y el stock no vuelve (pide el PIN)" }
                pin: { type: string, maxLength: 128, description: "el PIN de un admin, o su contraseña si ninguno cargó PIN" }
                ficha: { type: string, maxLength: 400 }
      responses:
        "200":
          description: Anulada (y si tenía factura, cuál espera su nota de crédito), o el PIN que falta
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: string }
                  porAfuera: { type: number, format: double, description: "Lo que falta devolver por el posnet o el banco (sin el efectivo, la cuenta corriente ni el cheque en cartera)" }
                  facturaPendiente: { type: string }
                  facturaSinCae: { type: boolean }
                  avisado: { type: boolean, description: "la factura que quedó viva se le avisó a administración" }
                  renglones:
                    type: array
                    description: "lo que tenía la venta, para rehacerla (sin los renglones de un corte)"
                    items:
                      type: object
                      required: [variantId, descripcion, unidad, cantidad, precioUnitario, presentacion]
                      properties:
                        variantId: { type: string, nullable: true }
                        descripcion: { type: string }
                        unidad: { type: string }
                        cantidad: { type: number, format: double }
                        precioUnitario: { type: number, format: double }
                        presentacion: { type: string, nullable: true }
                  conCorte: { type: boolean, description: "la venta tenía un corte, que no se rehace solo" }
                  error: { type: string }
                  autorizacion: { $ref: "#/components/schemas/MostradorAutorizacion" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/ventas/{id}/devolucion:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: DevolucionDeMostradorDatos
      description: Lo que se puede devolver de una venta del mostrador con factura (la ficha de facturación, la misma de la devolución del panel)
      responses:
        "200":
          description: Los renglones, la sucursal y por dónde puede volver la plata
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/Problema" }
    post:
      operationId: DevolucionDeMostrador
      description: >-
        La devolución parcial de una venta del mostrador (facturacion.DevolucionParcial): la nota,
        el stock y la plata. A quien no es admin le pide el PIN, como anular.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clave, destino, motivo, importe, renglones]
              properties:
                clave: { type: string }
                destino: { type: string, enum: [caja, cuenta, afuera, deuda] }
                motivo: { type: string }
                sinStock: { type: string, nullable: true, enum: [rota, otro, null] }
                sucursalId: { type: string, nullable: true }
                importe: { type: number, format: double }
                renglones: { type: array, items: { $ref: "#/components/schemas/MostradorRenglonADevolver" } }
                pin: { type: string, maxLength: 128 }
                ficha: { type: string, maxLength: 400 }
      responses:
        "200":
          description: Hecha, o el PIN que falta
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: string }
                  notaId: { type: string, nullable: true }
                  error: { type: string }
                  autorizacion: { $ref: "#/components/schemas/MostradorAutorizacion" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/ventas/{id}/devolucion/calculo:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: DevolucionDeMostradorCalculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [renglones]
              properties:
                renglones: { type: array, items: { $ref: "#/components/schemas/MostradorRenglonADevolver" } }
      responses:
        "200":
          description: Lo que se devolvería
          content:
            application/json:
              schema:
                type: object
                required: [importe]
                properties:
                  importe: { type: number, format: double }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/buscar:
    get:
      operationId: BuscarEnMostrador
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: sucursal, in: query, required: true, schema: { type: string } }
        - { name: cliente, in: query, schema: { type: string } }
      responses:
        "200":
          description: Hasta 12 variantes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MostradorVariante" } }
  /api/v1/mostrador/precios:
    post:
      operationId: PreciosDelCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantIds]
              additionalProperties: false
              properties:
                variantIds: { type: array, items: { type: string } }
                customerId: { type: string, nullable: true }
      responses:
        "200":
          description: Variante → precio para ese cliente
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: number, format: double } }
  /api/v1/mostrador/clientes:
    get:
      operationId: BuscarClientesEnMostrador
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Los 8 mejores
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MostradorCliente" } }
    post:
      operationId: AltaRapidaDeCliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: El cliente nuevo, o por qué no (y la ficha que ya tiene ese documento)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MostradorAltaRapida" }
  /api/v1/mostrador/clientes/recientes:
    get:
      operationId: ClientesRecientes
      parameters:
        - { name: sucursal, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Los últimos seis atendidos en la sucursal
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MostradorCliente" } }
  /api/v1/mostrador/presupuestos/{numero}:
    parameters:
      - { name: numero, in: path, required: true, schema: { type: string, maxLength: 20 } }
    get:
      operationId: PresupuestoParaElMostrador
      description: El presupuesto que se trae a la venta por su número; uno vencido trae los precios de hoy
      responses:
        "200":
          description: El presupuesto, para armar la venta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MostradorPresupuesto" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/clientes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: ClienteDelMostrador
      responses:
        "200":
          description: El cliente, o null
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: "#/components/schemas/MostradorCliente" }]
  /api/v1/mostrador/clientes/{id}/saldo:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: SaldoDeCuentaEnMostrador
      responses:
        "200":
          description: Lo que debe (positivo)
          content:
            application/json:
              schema:
                type: object
                required: [saldo]
                properties:
                  saldo: { type: number, format: double }
                  sinCobrar:
                    type: array
                    description: "pedidos del cliente con mercadería que salió y algo sin cobrar"
                    items:
                      type: object
                      required: [id, numero, monto]
                      properties:
                        id: { type: string }
                        numero: { type: string }
                        monto: { type: number, format: double }
  /api/v1/mostrador/clientes/{id}/cobro:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: CobrarCuentaEnMostrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, partes]
              additionalProperties: false
              properties:
                branchId: { type: string }
                partes: { type: string, description: "el JSON de las partes, como lo arma el formulario" }
                clave: { type: string, maxLength: 64, description: "la del intento: un reintento devuelve el mismo recibo" }
      responses:
        "200":
          description: El recibo
          content:
            application/json:
              schema:
                type: object
                required: [ok, receiptId, numero]
                properties:
                  ok: { type: string }
                  receiptId: { type: string }
                  numero: { type: string }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/presupuestos:
    post:
      operationId: PresupuestoDeMostrador
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: El presupuesto emitido
          content:
            application/json:
              schema:
                type: object
                required: [ok, quoteId, numero]
                properties:
                  ok: { type: string }
                  quoteId: { type: string }
                  numero: { type: string }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/caja/abrir:
    post:
      operationId: AbrirCaja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, fondoInicial]
              additionalProperties: false
              properties:
                branchId: { type: string }
                fondoInicial: { type: number, format: double, nullable: true }
                motivo: { type: string, description: "adónde fue (o de dónde vino) la diferencia con lo contado al cerrar el turno anterior" }
                cajaId: { type: string, description: "la caja física de la PC que abre, si tiene una" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/caja/movimiento:
    post:
      operationId: MovimientoDeCaja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, tipo, monto, motivo]
              additionalProperties: false
              properties:
                sessionId: { type: string }
                tipo: { type: string, enum: [ingreso, retiro] }
                monto: { type: number, format: double, nullable: true }
                motivo: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/caja/cerrar:
    post:
      operationId: CerrarCaja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, contado, notas]
              additionalProperties: false
              properties:
                sessionId: { type: string }
                contado: { type: number, format: double, nullable: true }
                notas: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/mostrador/caja/desvincular:
    post:
      operationId: DesvincularTerminal
      description: |
        Suelta la caja física de la PC que la tiene: le cambia el secreto, así
        esa PC deja de reconocerse en el latido y vuelve a pedir que se la
        vincule. Solo admin. Con ventas sin subir, no: ni las del último
        latido ni las que la PC tiene en su cola local (pendientes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cajaId]
              additionalProperties: false
              properties:
                cajaId: { type: string }
                pendientes:
                  type: integer
                  minimum: 0
                  description: Las ventas que esta PC tiene en su cola sin subir (sinSubir + atascadas).
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Problema" }
components:
  responses:
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    Ok:
      description: Hecho, con el mensaje para la pantalla
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: string }
  schemas:
    Problema:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores: { type: object, additionalProperties: { type: string } }
    MostradorLinea:
      type: object
      required: [variantId, descripcion, unidad, cantidad, precioUnitario]
      properties:
        variantId: { type: string, nullable: true }
        descripcion: { type: string }
        unidad: { type: string }
        cantidad: { type: number, format: double }
        precioUnitario: { type: number, format: double }
        presentacion: { type: string, nullable: true }
        precioLista: { type: number, format: double, nullable: true, description: el de la lista del cliente, que pone el servidor }
        corte: { type: integer, description: "el despiece de la venta del que salió el renglón (su índice en cortes)" }
    MostradorResultadoVenta:
      type: object
      required: [ok, total, nueva]
      properties:
        ok: { type: boolean }
        orderId: { type: string }
        numero: { type: string }
        total: { type: number, format: double }
        nueva: { type: boolean }
        lineas: { type: array, items: { $ref: "#/components/schemas/MostradorLinea" } }
        error: { type: string }
        autorizacion: { $ref: "#/components/schemas/MostradorAutorizacion" }
        ficha: { type: string, description: "un PIN ya tecleado para esta venta: si falló por otra cosa, se reenvía con la ficha" }
    MostradorRenglonADevolver:
      type: object
      required: [itemId, cantidad, alStock]
      properties:
        itemId: { type: string }
        cantidad: { type: number, format: double }
        alStock: { type: boolean }
        delAcopio: { type: number, format: double, nullable: true }
    MostradorAutorizacion:
      type: object
      description: Hace falta el PIN de un administrador (internal/autorizacion)
      required: [motivo, monto]
      properties:
        motivo: { type: string, enum: [precio, credito, anular, presupuesto, costo] }
        monto: { type: number, format: double, description: lo que se autoriza (lo dejado de cobrar, lo que pasa el límite, la venta que se anula) }
        credito: { type: number, format: double, description: con motivo precio, lo que además pasa el límite de cuenta corriente (el mismo PIN firma las dos cosas) }
        pinIncorrecto: { type: boolean }
        bloqueadoHasta: { type: string, format: date-time }
        sinAdmins: { type: boolean, description: ningún admin cargó su PIN }
        conClave: { type: boolean, description: "sin PIN cargado, firma la contraseña de un admin" }
    MostradorFiscalPendiente:
      type: object
      description: Lo que Next necesita para emitir el comprobante (facturación sigue en TS)
      required: [customerId, receptorNombre, cuit, lineas]
      properties:
        customerId: { type: string, nullable: true }
        receptorNombre: { type: string }
        cuit: { type: string, nullable: true }
        lineas: { type: array, items: { $ref: "#/components/schemas/MostradorLinea" } }
    MostradorResultadoDeCola:
      type: object
      required: [clave, estado]
      properties:
        clave: { type: string }
        estado: { type: string, enum: [sincronizada, rechazada, reintentar] }
        numero: { type: string }
        orderId: { type: string }
        nueva: { type: boolean }
        motivo: { type: string }
        fiscal: { $ref: "#/components/schemas/MostradorFiscalPendiente" }
    MostradorDescarga:
      type: object
      required: [resultados, servidorAt]
      properties:
        resultados: { type: array, items: { $ref: "#/components/schemas/MostradorResultadoDeCola" } }
        servidorAt: { type: string }
    MostradorErrorDeCola:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detalle: { type: string }
    MostradorVariante:
      type: object
      required: [variantId, sku, producto, medida, unidad, precio, stock, largoMm, anchoMm, color, categoria, formaDeVenta, precioMediaPct]
      properties:
        variantId: { type: string }
        sku: { type: string }
        producto: { type: string }
        medida: { type: string }
        unidad: { type: string }
        precio: { type: number, format: double }
        stock: { type: number, format: double }
        largoMm: { type: integer, nullable: true }
        anchoMm: { type: integer, nullable: true }
        color: { type: string, nullable: true }
        categoria: { type: string, nullable: true }
        formaDeVenta: { type: string, enum: [entera, entera_o_media, metro_cuadrado] }
        precioMediaPct: { type: number, format: double }
        piso: { type: number, format: double, nullable: true, description: "el precio final que apenas cubre el costo (sin costo cargado, null)" }
    MostradorPresupuesto:
      type: object
      required: [id, numero, customerId, contactoNombre, contactoTelefono, vencido, lineas]
      properties:
        id: { type: string }
        numero: { type: string }
        customerId: { type: string, nullable: true }
        contactoNombre: { type: string }
        contactoTelefono: { type: string, nullable: true }
        vencido: { type: boolean }
        lineas:
          type: array
          items:
            type: object
            required: [variantId, descripcion, unidad, cantidad, precioUnitario, presentacion, precioLista]
            properties:
              variantId: { type: string, nullable: true }
              descripcion: { type: string }
              unidad: { type: string }
              cantidad: { type: number, format: double }
              precioUnitario: { type: number, format: double }
              presentacion: { type: string, nullable: true }
              precioLista: { type: number, format: double, nullable: true }
    MostradorCliente:
      type: object
      required: [id, nombre, razonSocial, cuit, condicionIva, direccion, estado, priceListId, telefono, email]
      properties:
        id: { type: string }
        nombre: { type: string }
        razonSocial: { type: string, nullable: true }
        cuit: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        email: { type: string, nullable: true }
        condicionIva: { type: string }
        direccion: { type: string, nullable: true }
        estado: { type: string }
        limiteCredito: { type: number, format: double }
        priceListId: { type: string, nullable: true }
    MostradorAltaRapida:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        cliente:
          type: object
          required: [id, nombre, razonSocial, cuit, condicionIva, estado, priceListId, direccion]
          properties:
            id: { type: string }
            nombre: { type: string }
            razonSocial: { type: string, nullable: true }
            cuit: { type: string, nullable: true }
            condicionIva: { type: string }
            estado: { type: string }
            priceListId: { type: string, nullable: true }
            direccion: { type: string, nullable: true }
        error: { type: string }
        existente:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string }
            nombre: { type: string }
    MostradorTurno:
      type: object
      required: [id, sucursal, branchId, abiertaPor, abiertaAt, esperado, fondoInicial, fondoBase, ventasEnEfectivo, otrosIngresos, retiros, devoluciones, gastos, cantidadDeVentas]
      properties:
        id: { type: string }
        sucursal: { type: string }
        branchId: { type: string }
        abiertaPor: { type: string }
        abiertaAt: { type: string, format: date-time }
        esperado: { type: number, format: double }
        fondoInicial: { type: number, format: double }
        fondoBase: { type: number, format: double }
        ventasEnEfectivo: { type: number, format: double }
        otrosIngresos: { type: number, format: double }
        retiros: { type: number, format: double }
        devoluciones: { type: number, format: double, description: "anulaciones y devoluciones en efectivo (en negativo)" }
        gastos: { type: number, format: double, description: "gastos en efectivo cargados desde el panel (en negativo)" }
        cantidadDeVentas: { type: integer }
    MostradorMovimiento:
      type: object
      required: [id, tipo, monto, motivo, orderId, createdAt, quien]
      properties:
        id: { type: string }
        tipo: { type: string }
        monto: { type: number, format: double }
        motivo: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        quien: { type: string, nullable: true }
    MostradorVentaDeHoy:
      type: object
      required: [id, numero, cliente, total, medioPago, medios, conFactura, estado, createdAt]
      properties:
        id: { type: string }
        numero: { type: string }
        cliente: { type: string }
        total: { type: number, format: double }
        medioPago: { type: string, nullable: true }
        medios: { type: array, items: { type: string }, description: "todos los medios de un pago partido, del más grande al más chico" }
        conFactura: { type: boolean, description: "tiene factura viva: se puede devolver una parte" }
        estado: { type: string }
        createdAt: { type: string, format: date-time }
    MostradorRenglonDelCierre:
      type: object
      required: [medioPago, cantidad, total, devolucion, quien, cobranza]
      properties:
        medioPago: { type: string }
        cantidad: { type: integer }
        total: { type: number, format: double, description: En negativo si es una devolución }
        devolucion: { type: boolean, description: Ventas anuladas o devoluciones parciales durante el turno (la venta queda en el Z de su turno) }
        quien: { type: string, nullable: true, description: Quién hizo las devoluciones parciales del renglón }
        cobranza: { type: boolean, description: "lo cobrado por recibos de cuenta en el mostrador durante el turno" }
    MostradorPantalla:
      type: object
      required: [turno, movimientos, cierre, ventas, listaGeneral, fondoBase, descuentoLibrePct, ultimoContado]
      properties:
        turno:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MostradorTurno" }]
        movimientos: { type: array, items: { $ref: "#/components/schemas/MostradorMovimiento" } }
        cierre: { type: array, items: { $ref: "#/components/schemas/MostradorRenglonDelCierre" } }
        ventas: { type: array, items: { $ref: "#/components/schemas/MostradorVentaDeHoy" } }
        listaGeneral: { type: string, nullable: true }
        fondoBase: { type: number, format: double }
        descuentoLibrePct: { type: number, format: double, description: "lo que se puede dejar de cobrar sin el PIN de un admin (regla del negocio)" }
        ultimoContado: { type: number, format: double, nullable: true, description: "lo contado al cerrar el último turno de la sucursal: con eso abre el siguiente" }
