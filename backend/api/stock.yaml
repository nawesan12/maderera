openapi: 3.0.3
info:
  title: MJBJ · Stock
  version: "1"
  description: |
    El stock del panel: la grilla por sucursal (de a páginas, con una
    columna por cada sucursal activa de la base), las alertas, los últimos
    movimientos, el ajuste rápido y la transferencia entre sucursales. Cada
    cambio toma el candado del stock (el de las reservas) y deja su
    movimiento. Leer y cambiar: quien entra a /admin/stock (admin, vendedor
    y depósito); las métricas de las sucursales, quien entra a
    /admin/sucursales (el admin).
paths:
  /api/v1/admin/stock:
    get:
      operationId: GrillaDeStock
      parameters:
        - { name: busqueda, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoria, in: query, schema: { type: string } }
        - { name: estado, in: query, schema: { type: string, enum: [todas, sin-stock, reponer, con-stock, negativo] } }
        - { name: marca, in: query, schema: { type: string, maxLength: 120 } }
        - { name: proveedor, in: query, schema: { type: string } }
        - { name: sucursal, in: query, schema: { type: string, maxLength: 80 }, description: El slug de una sucursal; los grupos miran solo esa }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 30 } }
        - { name: desplazamiento, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Una página de las medidas activas con su stock en cada sucursal activa, el total del filtro y los conteos de cada grupo
          content:
            application/json:
              schema:
                type: object
                required: [filas, total, conteos, sucursales]
                properties:
                  filas: { type: array, items: { $ref: "#/components/schemas/FilaStock" } }
                  total: { type: integer }
                  conteos:
                    type: object
                    required: [todas, sinStock, reponer, conStock, negativo]
                    properties:
                      todas: { type: integer }
                      sinStock: { type: integer }
                      reponer: { type: integer }
                      conStock: { type: integer }
                      negativo: { type: integer, description: Lo vendido de más; cae también en reponer }
                  sucursales: { type: array, items: { $ref: "#/components/schemas/Sucursal" } }
  /api/v1/admin/stock/alertas:
    get:
      operationId: AlertasDeStock
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 8 } }
      responses:
        "200":
          description: Las que llegaron a su mínimo, las más justas primero
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [variantId, productName, label, branchName, qty, reservado, minQty]
                  properties:
                    variantId: { type: string }
                    productName: { type: string }
                    label: { type: string }
                    branchName: { type: string }
                    qty: { type: number, format: double }
                    reservado: { type: number, format: double }
                    minQty: { type: number, format: double }
  /api/v1/admin/stock/movimientos:
    get:
      operationId: UltimosMovimientos
      description: Los últimos de las medidas que pasan el mismo filtro que la grilla (sin filtro, los de todo)
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 10 } }
        - { name: busqueda, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoria, in: query, schema: { type: string } }
        - { name: marca, in: query, schema: { type: string, maxLength: 120 } }
        - { name: proveedor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Los últimos movimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, variantId, productId, productName, label, branchName, type, concepto, referencia, qty, note, createdAt, usuario, antes, despues]
                  properties:
                    id: { type: string }
                    variantId: { type: string }
                    productId: { type: string }
                    productName: { type: string }
                    label: { type: string }
                    branchName: { type: string }
                    type: { type: string }
                    concepto: { type: string, description: Qué fue (Rotura, Entrega, Recepción…) }
                    referencia: { type: string, nullable: true, description: El comprobante (REM-0020, PED-1098, TRA-0003…) }
                    qty: { type: number, format: double }
                    note: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }
                    usuario: { type: string, nullable: true, description: Quién lo hizo }
                    antes: { type: number, format: double, nullable: true, description: El stock de la sucursal antes de un ajuste o un conteo }
                    despues: { type: number, format: double, nullable: true, description: Y después }
  /api/v1/admin/stock/ajuste:
    post:
      operationId: AjustarStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, branchSlug, cantidad]
              additionalProperties: false
              properties:
                variantId: { type: string }
                branchSlug: { type: string }
                cantidad: { type: number, format: double, description: lo que se suma (o resta). Con contado, se ignora }
                contado:
                  type: number
                  format: double
                  minimum: 0
                  description: Lo que se contó en el galpón. Lo que salió en el camión de un pedido en camino se suma solo
                motivo: { type: string, enum: [ingreso, rotura, conteo, devolucion, faltante, correccion, otro, taller, reposicion] }
                pedido: { type: string, maxLength: 40, description: El pedido (PED-…) de una reposición a un cliente }
      responses:
        "200":
          description: El cambio («Casa Central 3 → 5»), o vacío si la cantidad era cero
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: string }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/stock/transferencia:
    post:
      operationId: TransferirStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, origenId, destinoId, cantidad]
              additionalProperties: false
              properties:
                variantId: { type: string }
                origenId: { type: string }
                destinoId: { type: string }
                cantidad: { type: string }
                nota: { type: string }
      responses:
        "204": { description: Registrada }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/stock/traslados:
    get:
      operationId: TrasladosEnCamino
      responses:
        "200":
          description: Los traslados que nadie recibió todavía, los más viejos primero
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Traslado" } }
    post:
      operationId: CrearTraslado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origenId, destinoId, renglones]
              additionalProperties: false
              properties:
                origenId: { type: string }
                destinoId: { type: string }
                nota: { type: string, maxLength: 300 }
                renglones:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [variantId, cantidad]
                    additionalProperties: false
                    properties:
                      variantId: { type: string }
                      cantidad: { type: string, maxLength: 20 }
      responses:
        "201":
          description: Salió del origen y quedó en camino
          content:
            application/json:
              schema:
                type: object
                required: [id, codigo]
                properties:
                  id: { type: string }
                  codigo: { type: string }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/stock/traslados/{id}:
    get:
      operationId: VerTraslado
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: El comprobante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Traslado" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/stock/traslados/{id}/recibir:
    post:
      operationId: RecibirTraslado
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                renglones:
                  type: array
                  maxItems: 100
                  description: Lo que llegó de cada medida. Sin renglones, llegó todo lo del comprobante
                  items:
                    type: object
                    required: [variantId, cantidad]
                    additionalProperties: false
                    properties:
                      variantId: { type: string }
                      cantidad: { type: string, maxLength: 20 }
                      faltante: { type: string, enum: [origen, perdido], description: Lo que no llegó de esta medida; sin esto, el de todo el traslado }
                faltante: { type: string, enum: [origen, perdido], description: Lo que no llegó vuelve al origen o se perdió }
      responses:
        "204": { description: Recibido; el destino suma lo que llegó }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/stock/traslados/{id}/anular:
    post:
      operationId: AnularTraslado
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Anulado; todo vuelve al origen }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/sucursales:
    get:
      operationId: SucursalesDelPanel
      responses:
        "200":
          description: Todas, por orden
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, slug, name, sortOrder, active, createdAt, fondoBase]
                  properties:
                    id: { type: string }
                    slug: { type: string }
                    name: { type: string }
                    sortOrder: { type: integer }
                    active: { type: boolean }
                    createdAt: { type: string, format: date-time }
                    fondoBase: { type: string }
  /api/v1/admin/sucursales/metricas:
    get:
      operationId: MetricasDeSucursales
      responses:
        "200":
          description: Los números de cada sucursal (hoy es el día argentino)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, slug, nombre, sortOrder, active, ventasHoy, pedidosHoy, clientesAtendidos, pedidosAbiertos, cortesEnCola,
                    stockValor, productosStockBajo]
                  properties:
                    id: { type: string }
                    slug: { type: string }
                    nombre: { type: string }
                    sortOrder: { type: integer }
                    active: { type: boolean }
                    ventasHoy: { type: number, format: double }
                    pedidosHoy: { type: integer }
                    clientesAtendidos: { type: integer }
                    pedidosAbiertos: { type: integer }
                    cortesEnCola: { type: integer }
                    stockValor: { type: number, format: double }
                    productosStockBajo: { type: integer }
  /api/v1/admin/sucursales/sin-asignar:
    get:
      operationId: SinSucursalAsignada
      responses:
        "200":
          description: Pedidos abiertos y cortes en cola sin sucursal
          content:
            application/json:
              schema:
                type: object
                required: [pedidos, cortes]
                properties:
                  pedidos: { type: integer }
                  cortes: { type: integer }
components:
  responses:
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
  schemas:
    Problema:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores: { type: object, additionalProperties: { type: string } }
    Nivel: { type: string, enum: [alto, medio, bajo, sin-stock] }
    Sucursal:
      type: object
      required: [id, slug, nombre]
      properties:
        id: { type: string }
        slug: { type: string }
        nombre: { type: string }
    StockEnSucursal:
      type: object
      required: [id, slug, nombre, qty, reservado, disponible, enReparto, galpon, llegando, min, nivel]
      properties:
        id: { type: string }
        slug: { type: string }
        nombre: { type: string }
        qty: { type: number, format: double }
        reservado: { type: number, format: double }
        disponible: { type: number, format: double, description: físico − reservado, con signo (negativo es lo vendido de más) }
        enReparto: { type: number, format: double, description: lo que va en el camión (remitos de envío sin firmar y pedidos en camino sin remito) }
        galpon: { type: number, format: double, description: lo que hay en el estante (el físico menos lo reservado de pedidos en camino sin remito) }
        llegando: { type: number, format: double, description: lo que viene en un traslado sin recibir }
        min: { type: number, format: double }
        nivel: { $ref: "#/components/schemas/Nivel" }
    FilaStock:
      type: object
      required: [variantId, productId, productSlug, productName, label, sku, codigoBarras, categoryName, unidad, largoMm, imagen, sucursales, total, faltante, paraReponer]
      properties:
        variantId: { type: string }
        productId: { type: string }
        productSlug: { type: string }
        productName: { type: string }
        label: { type: string }
        sku: { type: string }
        codigoBarras: { type: string, nullable: true }
        categoryName: { type: string }
        unidad: { type: string }
        largoMm: { type: integer, nullable: true }
        imagen: { type: string, nullable: true }
        sucursales: { type: array, items: { $ref: "#/components/schemas/StockEnSucursal" } }
        total: { type: number, format: double, description: la suma de lo disponible de las sucursales que tienen (un negativo no resta) }
        faltante: { type: number, format: double, description: lo vendido de más, sumado de las sucursales en negativo }
        paraReponer: { type: boolean }
    Traslado:
      type: object
      required: [id, codigo, origenId, origen, destino, nota, estado, creadoPor, createdAt, recibidoPor, recibidoAt, faltante, anuladoPor, anuladoAt, renglones]
      properties:
        id: { type: string }
        codigo: { type: string }
        origenId: { type: string }
        origen: { type: string }
        destino: { type: string }
        nota: { type: string, nullable: true }
        estado: { type: string, enum: [en-camino, recibido, anulado] }
        creadoPor: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        recibidoPor: { type: string, nullable: true }
        recibidoAt: { type: string, format: date-time, nullable: true }
        faltante: { type: string, nullable: true, enum: [origen, perdido], description: Qué pasó con lo que no llegó }
        anuladoPor: { type: string, nullable: true }
        anuladoAt: { type: string, format: date-time, nullable: true }
        renglones:
          type: array
          items:
            type: object
            required: [variantId, producto, medida, sku, unidad, cantidad, recibido, faltante]
            properties:
              variantId: { type: string }
              producto: { type: string }
              medida: { type: string }
              sku: { type: string }
              unidad: { type: string }
              cantidad: { type: number, format: double, description: Lo que se mandó }
              recibido: { type: number, format: double, nullable: true, description: Lo que llegó }
              faltante: { type: string, nullable: true, enum: [origen, perdido], description: Qué pasó con lo que no llegó de esta medida }
