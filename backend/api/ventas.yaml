openapi: 3.0.3
info:
  title: MJBJ · Ventas del panel
  version: "1"
  description: |
    Los pedidos y los presupuestos del panel (tanda 5): el tablero de
    pedidos y su ficha, avanzar, cancelar y marcar cobrado; el listado de
    presupuestos y su ficha, aceptarlos o rechazarlos, pasarlos a pedido y
    cargarlos a mano; y el presupuesto en PDF.

    Leer el tablero y mover un pedido: quien entra a /admin/pedidos. La
    ficha de un pedido: cualquier persona del panel (la leen también la
    impresión del ticket y el alta de un corte, que ve el aserradero).
    Presupuestos: quien entra a /admin/presupuestos; su ficha, además, el
    servidor de Next con el secreto interno (los avisos por WhatsApp). El
    PDF: el personal, el cliente dueño del presupuesto o el servidor de Next.

    Las acciones contestan { ok } o un problema con el mensaje para mostrar
    tal cual (el { error } que devolvían las server actions).
paths:
  /api/v1/admin/pedidos:
    get:
      operationId: ListarPedidos
      parameters:
        - { name: busqueda, in: query, schema: { type: string, maxLength: 200 } }
        - name: estado
          in: query
          description: Un estado del pedido, o sin-cobrar en el historial (los entregados sin cobrar, el más viejo primero)
          schema: { type: string }
        - { name: sucursal, in: query, schema: { type: string } }
        - name: vista
          in: query
          description: >-
            tablero: lo que está en curso más lo entregado o cancelado en la última semana.
            historial: lo cerrado, de a 50 (pagina), con desde y hasta. Sin vista, todo (como antes).
          schema: { type: string, enum: [tablero, historial] }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Los pedidos, el más nuevo primero. En el historial vienen hasta 51, para saber si hay más
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PedidoListado" } }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/pedidos/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: FichaDePedido
      responses:
        "200":
          description: La ficha con sus líneas, su historial, sus pagos y, para el admin, el margen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FichaDePedido" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/pedidos/{id}/ficha:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: UnirPedidoAFicha
      summary: Ata un pedido sin cliente (y sin recibos ni comprobantes) a la ficha con el correo de su contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              additionalProperties: false
              properties:
                customerId: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Hecho" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/pedidos/{id}/taller:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: PedidoParaElTaller
      summary: Lo que necesita el aserradero para cargar el corte de un pedido, sin importes ni datos de contacto
      responses:
        "200":
          description: El pedido, sin plata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoParaElTaller" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/pedidos/{id}/avanzar:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: AvanzarPedido
      description: >-
        Con `desde`, el estado que vio quien toca: si el pedido ya cambió,
        409 y no se avanza un paso de más (que en un retiro emite el remito).
      parameters:
        - { name: desde, in: query, schema: { type: string, maxLength: 40 } }
      requestBody:
        required: false
        description: >-
          Quien retira, para el remito de un retiro que pasa a entregado: el
          documento es obligatorio (422 en receptorDocumento sin él). En un
          envío no se usa.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                receptorNombre: { type: string, maxLength: 120 }
                receptorDocumento: { type: string, maxLength: 30 }
      responses:
        "200": { $ref: "#/components/responses/Hecho" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
        "409": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/pedidos/{id}/cancelar:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: CancelarPedido
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                motivo: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/Hecho" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/pedidos/{id}/entrega:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      operationId: CambiarEntregaDelPedido
      description: El día comprometido de entrega; vacío o null lo saca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                entregarEl: { type: string, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Hecho" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/pedidos/{id}/cobro:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: CobrarPedido
      summary: Cobrar el pedido con su recibo (cobros.EmitirRecibo); el efectivo entra al turno de su sucursal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partes]
              additionalProperties: false
              properties:
                partes: { type: string, description: "el JSON de las partes, como lo arma el formulario" }
                clave: { type: string, maxLength: 64, description: "la del intento: un reintento devuelve el mismo recibo" }
                branchId: { type: string, maxLength: 64, description: "un pedido sin sucursal: en qué caja entra el efectivo" }
      responses:
        "200":
          description: El recibo
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: string }
                  receiptId: { type: string }
                  aviso: { type: string }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
        "409": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/presupuestos:
    get:
      operationId: ListarPresupuestos
      parameters:
        - { name: busqueda, in: query, schema: { type: string, maxLength: 200 } }
        - { name: estado, in: query, schema: { type: string } }
        - { name: sucursal, in: query, schema: { type: string } }
        - { name: limite, in: query, description: sin límite, de a 30, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: desplazamiento, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Primero el compromiso de respuesta más cercano, después la obra más cercana, después lo más nuevo; los cerrados, del más nuevo al más viejo. Con el total del filtro para paginar.
          content:
            application/json:
              schema:
                type: object
                required: [filas, total, monto]
                properties:
                  filas: { type: array, items: { $ref: "#/components/schemas/PresupuestoListado" } }
                  total: { type: integer }
                  monto: { type: number, format: double, description: la suma de todos los que pasan el filtro }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
    post:
      operationId: CrearPresupuesto
      description: |
        El formulario como lo leía la acción: los campos del FormData con sus
        `|| undefined` en `cabecera`, las líneas ya pasadas por JSON.parse en
        `lineas`, y `convertir` si se apretó «Guardar y pasar a pedido».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cabecera, lineas]
              additionalProperties: false
              properties:
                cabecera: { type: object, additionalProperties: true }
                lineas: { type: array, maxItems: 500, items: {} }
                convertir: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Hecho" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/presupuestos/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: FichaDePresupuesto
      responses:
        "200":
          description: La ficha con sus líneas (la alícuota sale del producto)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FichaDePresupuesto" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/presupuestos/{id}/ficha:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: UnirPresupuestoAFicha
      summary: Ata un presupuesto sin cliente a la ficha con el correo de su contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              additionalProperties: false
              properties:
                customerId: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Hecho" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/presupuestos/{id}/estado:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: CambiarEstadoDePresupuesto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              additionalProperties: false
              properties:
                estado: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Hecho" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/admin/presupuestos/{id}/pedido:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: ConvertirPresupuestoEnPedido
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Cómo se entrega y cómo paga. Sin cuerpo, retiro en el local y sin medio.
              properties:
                tipoEntrega: { type: string, enum: [retiro, envio] }
                direccion: { type: string, maxLength: 300 }
                zona: { type: string, maxLength: 120 }
                costoEnvio: { type: number, format: double, minimum: 0 }
                medioPago: { $ref: "#/components/schemas/MedioPago" }
                entregarEl: { type: string, description: AAAA-MM-DD }
                precios: { type: string, enum: [actualizar, respetar], description: "para un presupuesto vencido: los de hoy o los del presupuesto (pasado lo libre, con el PIN de un admin)" }
                pin: { type: string, maxLength: 20 }
                ficha: { type: string, maxLength: 400 }
      responses:
        "200": { $ref: "#/components/responses/Hecho" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "404": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }
  /api/v1/presupuestos/{id}/pdf:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: PresupuestoPdf
      description: |
        El personal baja cualquiera; el cliente, solo los que apuntan a su
        ficha. A los demás, 404 (no 403: confirmaría que existe).
      responses:
        "200":
          description: El PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problema" }
components:
  responses:
    Hecho:
      description: Hecho, con el mensaje para mostrar
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResultadoDeVenta" }
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
  schemas:
    MedioPago:
      type: string
      enum: [efectivo, transferencia, debito, credito, mercado_pago, cuenta_corriente]
    Problema:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores: { type: object, additionalProperties: { type: string } }
    ResultadoDeVenta:
      type: object
      required: [ok]
      properties:
        ok: { type: string }
        id: { type: string, description: El pedido creado (o el presupuesto, si no se convirtió) }
        numero: { type: string }
        estado: { type: string, description: El estado al que llegó el pedido }
    PlazoDelPresupuesto:
      type: object
      required: [texto, urgente, vencido]
      properties:
        texto: { type: string }
        urgente: { type: boolean }
        vencido: { type: boolean }
    PresupuestoListado:
      type: object
      required: [id, numero, cliente, empresa, customerId, sucursal, estado, origen, total, items, asesor, createdAt, validoHasta,
        vencido, respondeHasta, necesitaPara, plazo, pedidoId, numeroPedido]
      properties:
        id: { type: string }
        numero: { type: string }
        cliente: { type: string }
        empresa: { type: string, nullable: true }
        customerId: { type: string, nullable: true }
        sucursal: { type: string, nullable: true }
        estado: { type: string }
        origen: { type: string }
        total: { type: number, format: double }
        items: { type: integer }
        asesor: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        validoHasta: { type: string, format: date-time, nullable: true }
        vencido: { type: boolean }
        respondeHasta: { type: string, format: date-time, nullable: true }
        necesitaPara: { type: string, format: date-time, nullable: true }
        plazo:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PlazoDelPresupuesto" }]
        pedidoId: { type: string, nullable: true }
        numeroPedido: { type: string, nullable: true }
    ItemDePresupuesto:
      type: object
      required: [id, variantId, descripcion, unidad, cantidad, precioUnitario, subtotal, orden, alicuotaIva]
      properties:
        id: { type: string }
        variantId: { type: string, nullable: true }
        descripcion: { type: string }
        unidad: { type: string }
        cantidad: { type: string }
        precioUnitario: { type: string }
        subtotal: { type: string }
        orden: { type: integer }
        alicuotaIva: { type: string, nullable: true }
    FichaParaUnir:
      type: object
      description: >-
        La única ficha activa sin cuenta web con el correo del contacto. Con dos o más, ninguna: se busca a mano.
      required: [id, nombre, telefono, unible]
      properties:
        id: { type: string }
        nombre: { type: string }
        telefono: { type: string, nullable: true, description: "para comparar con el del contacto antes de unir" }
        unible: { type: boolean, description: "un pedido con recibos o comprobantes no se une desde acá" }
    FichaDePresupuesto:
      type: object
      required: [id, numero, cliente, email, telefono, empresa, customerId, clienteCodigo, clienteCuit, clienteCondicionIva,
        clienteDireccion, sucursal, sucursalSlug, vendedor, estado, origen, subtotal, total, notas, asesor, validoHasta, createdAt, items,
        pedidoId, numeroPedido, vencido, totalDeHoy]
      properties:
        vencido: { type: boolean, description: "pasó su validez: para pasarlo a pedido hay que elegir los precios" }
        totalDeHoy: { type: string, nullable: true, description: "el total con los precios de lista de hoy, si venció" }
        fichaPorCorreo:
          nullable: true
          description: Sin cliente, la ficha con el correo del contacto (para unirlo a mano)
          allOf: [{ $ref: "#/components/schemas/FichaParaUnir" }]
        id: { type: string }
        numero: { type: string }
        cliente: { type: string }
        email: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        empresa: { type: string, nullable: true }
        customerId: { type: string, nullable: true }
        clienteCodigo: { type: string, nullable: true }
        clienteCuit: { type: string, nullable: true }
        clienteCondicionIva: { type: string, nullable: true }
        clienteDireccion: { type: string, nullable: true }
        sucursal: { type: string, nullable: true }
        sucursalSlug: { type: string, nullable: true }
        vendedor: { type: string, nullable: true }
        estado: { type: string }
        origen: { type: string }
        subtotal: { type: string }
        total: { type: string }
        notas: { type: string, nullable: true }
        asesor: { type: string, nullable: true }
        validoHasta: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/ItemDePresupuesto" } }
        pedidoId: { type: string, nullable: true, description: El pedido en que se convirtió }
        numeroPedido: { type: string, nullable: true }
    PedidoListado:
      type: object
      required: [id, numero, cliente, empresa, sucursal, sucursalSlug, estado, tipoEntrega, direccionEntrega, medioPago, estadoPago,
        total, items, customerId, createdAt, zonaEnvio, sinCobrar, pagoEnRevision, entregadoAt, entregarEl, porEntregar, cortesSinTerminar,
        comprobante, facturado, acopio]
      properties:
        acopio: { type: boolean, description: Se retira de a partes (ya salió algo, o es la venta del mostrador en acopio) }
        entregarEl: { type: string, nullable: true, description: AAAA-MM-DD }
        porEntregar:
          type: array
          description: Lo que falta de un pedido que ya salió en parte; vacío si no salió nada
          items: { $ref: "#/components/schemas/PorEntregar" }
        cortesSinTerminar: { type: array, items: { type: string }, description: Los cortes del pedido en cola o en la máquina }
        comprobante: { type: string, nullable: true, enum: [interno, fiscal, null], description: Con qué salió la venta del mostrador }
        facturado: { type: boolean, description: Tiene una factura viva }
        id: { type: string }
        numero: { type: string }
        cliente: { type: string }
        empresa: { type: string, nullable: true }
        sucursal: { type: string, nullable: true }
        sucursalSlug: { type: string, nullable: true }
        estado: { type: string }
        tipoEntrega: { type: string }
        zonaEnvio: { type: string, nullable: true }
        direccionEntrega: { type: string, nullable: true }
        medioPago: { type: string, nullable: true }
        estadoPago: { type: string }
        total: { type: number, format: double }
        items: { type: integer }
        customerId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        sinCobrar: { $ref: "#/components/schemas/SinCobrar" }
        pagoEnRevision: { type: boolean, description: Una transferencia informada que nadie verificó todavía }
        entregadoAt: { type: string, format: date-time, nullable: true, description: El último paso a entregado del historial }
    PorEntregar:
      type: object
      required: [descripcion, unidad, pendiente]
      properties:
        descripcion: { type: string }
        unidad: { type: string }
        pendiente: { type: number, format: double }
    ReciboDelPedido:
      type: object
      required: [id, numero, total, estado, medios, quien, createdAt]
      properties:
        id: { type: string }
        numero: { type: string }
        total: { type: number, format: double }
        estado: { type: string }
        medios: { type: string, description: Los medios del recibo separados por coma }
        quien: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SinCobrar:
      type: number
      format: double
      nullable: true
      description: >-
        Lo que falta cobrar sin pasar por la cuenta corriente (el total menos lo cobrado en línea); null si no falta
        nada o si la deuda está en la cuenta del cliente. La misma regla que «Me deben».
    ItemDePedido:
      type: object
      required: [id, orderId, variantId, descripcion, unidad, cantidad, precioUnitario, subtotal, presentacion, stockPorUnidad,
        costoUnitario, alicuotaIva, orden]
      properties:
        id: { type: string }
        orderId: { type: string }
        variantId: { type: string, nullable: true }
        descripcion: { type: string }
        unidad: { type: string }
        cantidad: { type: string }
        precioUnitario: { type: string }
        subtotal: { type: string }
        presentacion: { type: string, nullable: true }
        stockPorUnidad: { type: number, format: double }
        costoUnitario: { type: string, nullable: true }
        alicuotaIva: { type: string, nullable: true }
        orden: { type: integer }
    PasoDelPedido:
      type: object
      required: [id, orderId, estado, nota, createdByUserId, quien, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        estado: { type: string }
        nota: { type: string, nullable: true }
        createdByUserId: { type: string, nullable: true }
        quien: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PagoDelPedido:
      type: object
      required: [medio, importe, nroLote, nroCupon, cuotas, tarjeta]
      properties:
        medio: { type: string }
        importe: { type: string }
        nroLote: { type: string, nullable: true }
        nroCupon: { type: string, nullable: true }
        cuotas: { type: integer }
        tarjeta: { type: string, nullable: true }
    MargenDelPedido:
      type: object
      required: [neto, costo, ganancia, sinCosto]
      properties:
        neto: { type: number, format: double }
        costo: { type: number, format: double }
        ganancia: { type: number, format: double }
        sinCosto: { type: integer }
    PedidoParaElTaller:
      type: object
      description: |
        La ficha para quien corta (el aserradero): qué y para quién, sin
        importes, mail, teléfono, saldo, pagos ni margen. Un tipo aparte y no
        la ficha con los importes en cero: un $0 en el papel se lee «gratis».
      required: [id, numero, cliente, empresa, customerId, branchId, sucursal, estado, tipoEntrega, entregarEl, notas, items]
      properties:
        id: { type: string }
        numero: { type: string }
        cliente: { type: string }
        empresa: { type: string, nullable: true }
        customerId: { type: string, nullable: true }
        branchId: { type: string, nullable: true }
        sucursal: { type: string, nullable: true }
        estado: { type: string }
        tipoEntrega: { type: string }
        entregarEl: { type: string, nullable: true }
        notas: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [variantId, descripcion, unidad, cantidad, presentacion]
            properties:
              variantId: { type: string, nullable: true }
              descripcion: { type: string }
              unidad: { type: string }
              cantidad: { type: string }
              presentacion: { type: string, nullable: true }
    FichaDePedido:
      type: object
      required: [id, numero, numeroProvisorio, cliente, email, telefono, empresa, branchId, customerId, sucursal, estado, origen,
        tipoEntrega, direccionEntrega, zonaEnvio, costoEnvio, subtotal, descuento, descuentoMotivo, total, medioPago, estadoPago,
        notas, createdAt, items, historial, pagos, margen, quoteId, numeroPresupuesto, saldoCliente, entregarEl, sinCobrar,
        cobrado, aCobrar, recibos, comprobante, acopio]
      properties:
        acopio: { type: boolean, description: Se retira de a partes (ya salió algo, o es la venta del mostrador en acopio) }
        cobrado: { type: number, format: double, description: Lo cobrado con recibos y en línea }
        aCobrar: { type: number, format: double, description: El total menos lo devuelto contra la deuda }
        recibos: { type: array, items: { $ref: "#/components/schemas/ReciboDelPedido" } }
        comprobante: { type: string, nullable: true, enum: [interno, fiscal, null] }
        id: { type: string }
        numero: { type: string }
        numeroProvisorio: { type: string, nullable: true }
        cliente: { type: string }
        email: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        empresa: { type: string, nullable: true }
        branchId: { type: string, nullable: true }
        customerId: { type: string, nullable: true }
        sucursal: { type: string, nullable: true }
        estado: { type: string }
        origen: { type: string }
        tipoEntrega: { type: string }
        direccionEntrega: { type: string, nullable: true }
        zonaEnvio: { type: string, nullable: true }
        costoEnvio: { type: string }
        subtotal: { type: string }
        descuento: { type: string }
        descuentoMotivo: { type: string, nullable: true }
        total: { type: string }
        medioPago: { type: string, nullable: true }
        estadoPago: { type: string }
        notas: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/ItemDePedido" } }
        historial: { type: array, items: { $ref: "#/components/schemas/PasoDelPedido" } }
        pagos: { type: array, items: { $ref: "#/components/schemas/PagoDelPedido" } }
        margen:
          nullable: true
          description: Solo para el admin, y solo si alguna línea tiene costo congelado
          allOf: [{ $ref: "#/components/schemas/MargenDelPedido" }]
        quoteId: { type: string, nullable: true }
        numeroPresupuesto: { type: string, nullable: true }
        saldoCliente: { type: number, format: double, nullable: true, description: Positivo, debe }
        entregarEl: { type: string, nullable: true, description: AAAA-MM-DD }
        sinCobrar: { $ref: "#/components/schemas/SinCobrar" }
        fichaPorCorreo:
          nullable: true
          description: Sin cliente, la ficha con el correo del contacto (para unirlo a mano)
          allOf: [{ $ref: "#/components/schemas/FichaParaUnir" }]
