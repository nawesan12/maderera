# El servidor entero: base, aplicación, el que atiende internet y el respaldo.
#
# Todo en una sola máquina. Es la configuración que reemplaza a Vercel, Neon y
# Vercel Blob: una VPS chica alcanza para el tráfico de una maderera de Mar del
# Plata.
#
# Lo que hay que tener presente: acá el mantenimiento es propio. Las
# actualizaciones del sistema, que la máquina no se llene y —sobre todo— que
# los respaldos se estén haciendo, no los cubre nadie más. El respaldo está
# resuelto en el servicio `respaldo`; lo que no está resuelto es que alguien
# mire de vez en cuando que sigue corriendo.
#
# **Siempre con `--env-file .env.produccion`.** Los `${...}` de este archivo
# salen de ahí, y sin esa opción Compose busca un `.env` que no existe y deja
# todo vacío. `scripts/desplegar.sh` ya lo pasa; a mano:
#
#   docker compose --env-file .env.produccion -f docker-compose.prod.yml ps

name: mjbj

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env.produccion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env.produccion}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env.produccion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # **Solo en loopback.** El puerto se publica para que el build de la
    # aplicación pueda consultar la base —Next prerenderiza páginas que leen
    # los ajustes y las sucursales— y para `scripts/mudar-base.sh`. Con
    # `127.0.0.1` queda invisible desde internet: Docker se saltea ufw para los
    # puertos que publica, así que no alcanza con el firewall; lo que lo
    # protege es no escuchar en la IP pública.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
      # Con la red del host, para que el build llegue al puerto de loopback
      # donde está la base.
      network: host
      args:
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
        DATABASE_SSL: "off"
        APP_URL: ${APP_URL:?Falta APP_URL en .env.produccion}
        APP_ENV: ${APP_ENV:-production}
        SEO_INDEXAR: ${SEO_INDEXAR:-}
        GIT_SHA: ${GIT_SHA:-}
    image: mjbj-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.produccion
    environment:
      # Estas pisan lo que diga `.env.produccion`: la URL de la base la arma el
      # compose con el nombre interno del contenedor.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # La base está en la misma máquina y en una red privada de Docker:
      # cifrar ese tramo no protege de nada y el Postgres del compose ni
      # siquiera lo admite.
      DATABASE_SSL: "off"
      # Las fotos van a un volumen y no adentro de la imagen: si vivieran en
      # `public/`, cada despliegue borraría lo que se subió desde el panel.
      CARPETA_SUBIDAS: /datos/subidas
      # Los adjuntos de WhatsApp (fotos, PDF y audios de los clientes) van
      # aparte y **Caddy no monta este volumen**: solo se sirven por
      # `/api/whatsapp/medios/<id>`, con sesión de la bandeja.
      CARPETA_PRIVADA: /datos/privado
      # Hay un proceso que vive y un cron: enciende el tiempo real del panel
      # (`lib/vivo`). En Vercel no está y las pantallas consultan cada tanto.
      PLATAFORMA: vps
      # El envío de los avisos y las campañas por el servidor de correo propio
      # (servicio `correo`), cuando `.env.produccion` dice EMAIL_PROVIDER=smtp
      # y trae SMTP_USUARIO y SMTP_CLAVE. Se conecta por la red interna con el
      # nombre del contenedor, y verifica el certificado contra el nombre
      # público: el certificado es de `mail.<dominio>`, no de `correo`.
      SMTP_HOST: ${SMTP_HOST:-correo}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_NOMBRE_TLS: ${SMTP_NOMBRE_TLS:-mail.${DOMINIO}}
      # El certificado de ARCA, como archivos de solo lectura (ver el volumen
      # abajo). Si todavía no están, la facturación sigue con el proveedor
      # interno, igual que sin variables.
      ARCA_CERTIFICADO_ARCHIVO: /run/secrets/arca/arca.crt
      ARCA_CLAVE_PRIVADA_ARCHIVO: /run/secrets/arca/arca.key
    volumes:
      - subidas:/datos/subidas
      - privado:/datos/privado
      # La caché de Next —las imágenes ya optimizadas y los datos de
      # `unstable_cache`— sobrevive al despliegue. Sin esto, cada deploy
      # arranca en frío y la primera visita a cada foto la vuelve a
      # recomprimir. Es lo mismo que hacía Vercel con su Data Cache, que
      # también persiste entre despliegues.
      - next_cache:/app/.next/cache
      # El certificado y la clave de ARCA, de `secretos/arca/` en el servidor
      # y en solo lectura. Nunca entran en la imagen: `.dockerignore` deja
      # `secretos/` afuera. Solo esta subcarpeta: la configuración de rclone,
      # que da acceso a los respaldos, no tiene por qué verla la aplicación.
      - ./secretos/arca:/run/secrets/arca:ro
    # **Sin `ports`.** Solo Caddy le habla a la aplicación, por la red interna.
    # Si el puerto estuviera publicado, cualquiera podría saltearse Caddy y
    # mandar el `X-Forwarded-For` que quisiera, y el límite de frecuencia
    # contaría contra la IP que el atacante eligiera.
    expose:
      - "3000"
    # `docker stop` manda SIGTERM y Next termina lo que tiene en curso —los
    # pedidos abiertos y lo pendiente de `after()`, como el aviso de una
    # venta— antes de salir. Diez segundos, el valor por omisión, pueden no
    # alcanzar para un correo que tarda.
    stop_grace_period: 30s
    healthcheck:
      # `robots.txt` es estático: contesta si el servidor está vivo sin tocar
      # la base.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Las migraciones y los scripts de mudanza. No queda corriendo: el perfil
  # `herramientas` hace que `up` lo ignore, y se usa con `run --rm`.
  migrador:
    profiles: ["herramientas"]
    build:
      context: .
      target: migrador
    image: mjbj-migrador:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.produccion
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "off"
      CARPETA_SUBIDAS: /datos/subidas
      CARPETA_PRIVADA: /datos/privado
    volumes:
      - subidas:/datos/subidas
      - privado:/datos/privado

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Si el firewall no deja pasar UDP 443, el navegador vuelve solo
      # a HTTP/2.
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env.produccion}
      # Los nombres que redirigen al principal, separados por espacio.
      REDIRIGIDOS: www.${DOMINIO}${DOMINIO_ALTERNATIVO:+ ${DOMINIO_ALTERNATIVO} www.${DOMINIO_ALTERNATIVO}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # La misma carpeta que escribe la aplicación: las fotos las sirve Caddy
      # directamente, sin pasar por Node.
      - subidas:/datos/subidas:ro
      - caddy_data:/data
      - caddy_config:/config
      # El registro de acceso queda en el disco del servidor, donde lo lee
      # fail2ban.
      - /var/log/caddy:/var/log/caddy

  respaldo:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
      RESPALDO_DIAS: ${RESPALDO_DIAS:-14}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_DIAS: ${RCLONE_DIAS:-90}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      CORREO_RESPALDO: ${CORREO_RESPALDO:-si}
    volumes:
      - ./respaldos:/respaldos
      - ./scripts/respaldo.sh:/respaldo.sh:ro
      # Los buzones y la configuración del correo (casillas, claves, llaves
      # DKIM), en solo lectura: el respaldo los empaqueta junto con la base.
      # Si el correo propio no está en uso, los volúmenes están vacíos y el
      # respaldo lo saltea.
      - correo_buzones:/correo/buzones:ro
      - correo_estado:/correo/estado:ro
      - correo_config:/correo/config:ro
      # La configuración de rclone, si hay copia fuera de la máquina. Va con
      # escritura porque algunos destinos renuevan el token ahí adentro.
      - ./secretos/rclone:/config/rclone
    entrypoint: ["sh", "/respaldo.sh"]

  # Las tareas programadas (ver `servidor/cron/crontab` y `lib/tareas`). Un
  # crond de busybox y nada más: no guarda estado ni sabe qué hace cada tarea,
  # solo llama a la aplicación a horario. El candado de «una vez por período»
  # está en la base, así que reiniciar este contenedor no repite nada.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # En formato POSIX y no «America/Argentina/Buenos_Aires»: alpine no trae
      # la base de zonas, y Argentina no tiene horario de verano, así que «tres
      # horas al oeste de UTC» es exacto todo el año.
      TZ: ART3
      TAREAS_SECRETO: ${TAREAS_SECRETO:?Falta TAREAS_SECRETO en .env.produccion}
    volumes:
      - ./servidor/cron/crontab:/etc/crontabs/root:ro
      - ./servidor/cron/tarea.sh:/tarea.sh:ro
    # crond no hereda el entorno: el secreto se deja en un archivo que solo
    # vive dentro del contenedor, y `tarea.sh` lo lee de ahí.
    entrypoint:
      - sh
      - -c
      - 'umask 077; printf %s "$$TAREAS_SECRETO" > /run/secreto; exec crond -f -l 8'


  # **Las casillas de correo propias** (docker-mailserver: Postfix, Dovecot y
  # Rspamd). Es la pieza que más mantenimiento pide de todo el servidor —ver
  # «Correo propio» en docs/SERVIDOR-PROPIO.md antes de encenderla—, por eso
  # va en un perfil: solo levanta con `COMPOSE_PROFILES=correo` en
  # `.env.produccion`. Sin eso, el resto del servidor anda igual y los avisos
  # pueden seguir saliendo por Resend.
  correo:
    profiles: ["correo"]
    image: mailserver/docker-mailserver:16.0.1
    # El nombre con que se presenta a los otros servidores. Tiene que coincidir
    # con el registro A de `mail`, con el PTR de la IP (lo configura Hostinger)
    # y con el certificado: si no, Gmail lo trata como sospechoso.
    hostname: mail.${DOMINIO}
    restart: unless-stopped
    env_file:
      - ./servidor/correo/correo.env
    environment:
      POSTMASTER_ADDRESS: postmaster@${DOMINIO}
      # El certificado lo saca y lo renueva Caddy (bloque `mail.` del
      # Caddyfile), y acá se lee de su volumen. Con `SSL_TYPE=manual` el
      # servidor de correo vigila esos archivos y se recarga solo cuando Caddy
      # los renueva. La ruta lleva el emisor: por eso el Caddyfile fija Let's
      # Encrypt para ese nombre y no deja que caiga en otro.
      SSL_CERT_PATH: ${CORREO_CERTIFICADO:-/srv/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${DOMINIO}/mail.${DOMINIO}.crt}
      SSL_KEY_PATH: ${CORREO_CLAVE_CERTIFICADO:-/srv/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${DOMINIO}/mail.${DOMINIO}.key}
    # **Publicados a internet, a diferencia de la aplicación.** 25 para
    # recibir de otros servidores, 465 y 587 para que las personas manden, 993
    # para leer. No 143 ni 110: son IMAP y POP sin cifrar, y no hay ningún
    # programa de correo de hoy que los necesite.
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - correo_buzones:/var/mail
      - correo_estado:/var/mail-state
      - correo_registro:/var/log/mail
      # Casillas, alias y llaves DKIM: lo escribe `scripts/correo.sh`. En un
      # volumen y no en el repositorio porque tiene las claves.
      - correo_config:/tmp/docker-mailserver
      - ./servidor/correo/fail2ban-jail.cf:/tmp/docker-mailserver/fail2ban-jail.cf:ro
      - caddy_data:/srv/caddy:ro
    # fail2ban banea con nftables dentro del contenedor, y para eso necesita
    # tocar la red.
    cap_add:
      - NET_ADMIN
    # Postfix termina de entregar lo que tiene en curso antes de cortar.
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"]
      interval: 1m
      timeout: 5s
      start_period: 2m
      retries: 3
    networks:
      default:
        # Dentro de Docker, `mail.<dominio>` es este contenedor. El webmail se
        # conecta por ese nombre y el certificado coincide, así que la conexión
        # interna también va verificada.
        aliases:
          - mail.${DOMINIO}

  # El webmail: leer y mandar desde el navegador, sin configurar nada. Para
  # el mostrador o una PC prestada; en el teléfono conviene la aplicación de
  # correo (ver la guía). Detrás de Caddy, en `webmail.<dominio>`.
  webmail:
    profiles: ["correo"]
    image: roundcube/roundcubemail:1.7.4-apache-nonroot
    restart: unless-stopped
    depends_on:
      - correo
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.${DOMINIO}
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail.${DOMINIO}
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      # Sus propias tablas (libreta de direcciones, preferencias) en SQLite y no
      # en la base de la tienda: no tienen nada que ver, y así un problema de
      # una no toca a la otra.
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
    volumes:
      # El volumen va en `/var/roundcube` y no en `/var/roundcube/db`: esa
      # carpeta no existe en la imagen, Docker la crearía como root y Roundcube
      # —que corre sin root— no podría escribir su base. La de arriba es de su
      # usuario, y un volumen nuevo hereda el dueño de lo que tapa.
      - webmail_db:/var/roundcube
      - ./servidor/webmail/maderera.inc.php:/var/roundcube/config/maderera.inc.php:ro
      - ./servidor/webmail/php.ini:/usr/local/etc/php/conf.d/zzz-maderera.ini:ro
    expose:
      - "8000"

volumes:
  pgdata:
  subidas:
  privado:
  next_cache:
  caddy_data:
  caddy_config:
  correo_buzones:
  correo_estado:
  correo_registro:
  correo_config:
  webmail_db:
