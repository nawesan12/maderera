# El servidor entero: base, aplicación, el que atiende internet y el respaldo.
#
# Todo en una sola máquina. Es la configuración que reemplaza a Vercel, Neon y
# Vercel Blob: una VPS chica alcanza para el tráfico de una maderera de Mar del
# Plata.
#
# Lo que hay que tener presente: acá el mantenimiento es propio. Las
# actualizaciones del sistema, que la máquina no se llene y —sobre todo— que
# los respaldos se estén haciendo, no los cubre nadie más. El respaldo está
# resuelto en el servicio `respaldo`; lo que no está resuelto es que alguien
# mire de vez en cuando que sigue corriendo.
#
# **Siempre con `--env-file .env.produccion`.** Los `${...}` de este archivo
# salen de ahí, y sin esa opción Compose busca un `.env` que no existe y deja
# todo vacío. `scripts/desplegar.sh` ya lo pasa; a mano:
#
#   docker compose --env-file .env.produccion -f docker-compose.prod.yml ps

name: mjbj

services:
  db:
    # **La misma versión mayor que Neon** (18): un `pg_dump` más viejo que la
    # base de origen se niega a volcarla, y un `pg_restore` más viejo que el
    # volcado no lo lee. Si se cambia acá, cambiar también `respaldo` (abajo) e
    # `IMAGEN_PG` en scripts/mudar-base.sh.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env.produccion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env.produccion}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env.produccion}
    volumes:
      # Desde la 18 la imagen guarda los datos en `/var/lib/postgresql/18/docker`
      # y el volumen va en `/var/lib/postgresql`, un nivel más arriba: así una
      # actualización a la 19 deja la carpeta de la 18 al lado y se puede
      # migrar con `pg_upgrade`. Montarlo en `.../data`, como hasta la 17, hace
      # que la imagen no arranque.
      - pgdata:/var/lib/postgresql
    # **Solo en loopback.** El puerto se publica para que el build de la
    # aplicación pueda consultar la base —Next prerenderiza páginas que leen
    # los ajustes y las sucursales— y para `scripts/mudar-base.sh`. Con
    # `127.0.0.1` queda invisible desde internet: Docker se saltea ufw para los
    # puertos que publica, así que no alcanza con el firewall; lo que lo
    # protege es no escuchar en la IP pública.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
      # Con la red del host, para que el build llegue al puerto de loopback
      # de la API de Go: con Cache Components el build arma de antemano lo
      # público en caché (los rubros del layout, el equipaje del asistente).
      # `desplegar.sh` levanta la API nueva antes de construir. La app ya no
      # le habla a la base: ni el build ni la imagen llevan su URL.
      network: host
      args:
        API_URL: http://127.0.0.1:8080
        APP_URL: ${APP_URL:?Falta APP_URL en .env.produccion}
        APP_ENV: ${APP_ENV:-production}
        SEO_INDEXAR: ${SEO_INDEXAR:-}
        GIT_SHA: ${GIT_SHA:-}
    image: mjbj-app:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env.produccion
    environment:
      # Sin DATABASE_URL a propósito: todo dato pasa por la API de Go. (Si
      # `.env.produccion` la trae, no se usa: nada de la app importa lib/db,
      # y ESLint lo frena.)
      # Las fotos van a un volumen y no adentro de la imagen: si vivieran en
      # `public/`, cada despliegue borraría lo que se subió desde el panel.
      CARPETA_SUBIDAS: /datos/subidas
      # Los adjuntos de WhatsApp (fotos, PDF y audios de los clientes) van
      # aparte y **Caddy no monta este volumen**: solo se sirven por
      # `/api/whatsapp/medios/<id>`, con sesión de la bandeja.
      CARPETA_PRIVADA: /datos/privado
      # Hay un proceso que vive: enciende el tiempo real del panel
      # (`lib/vivo`). En Vercel no está y las pantallas consultan cada tanto.
      PLATAFORMA: vps
      # El envío de los avisos y las campañas por el servidor de correo propio
      # (servicio `correo`), cuando `.env.produccion` dice EMAIL_PROVIDER=smtp
      # y trae SMTP_USUARIO y SMTP_CLAVE. Se conecta por la red interna con el
      # nombre del contenedor, y verifica el certificado contra el nombre
      # público: el certificado es de `mail.<dominio>`, no de `correo`.
      SMTP_HOST: ${SMTP_HOST:-correo}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_NOMBRE_TLS: ${SMTP_NOMBRE_TLS:-mail.${CORREO_DOMINIO:-${DOMINIO}}}
      # La API de Go (backend/, docs/go/PLAN.md): la sesión y, tanda por
      # tanda, todo lo que la aplicación leía de la base. Por la red interna.
      API_URL: http://api:8080
      # El certificado de ARCA, como archivos de solo lectura (ver el volumen
      # abajo). Si todavía no están, la facturación sigue con el proveedor
      # interno, igual que sin variables.
      ARCA_CERTIFICADO_ARCHIVO: /run/secrets/arca/arca.crt
      ARCA_CLAVE_PRIVADA_ARCHIVO: /run/secrets/arca/arca.key
    volumes:
      - subidas:/datos/subidas
      - privado:/datos/privado
      # La caché de Next —las imágenes ya optimizadas y los datos de
      # `unstable_cache`— sobrevive al despliegue. Sin esto, cada deploy
      # arranca en frío y la primera visita a cada foto la vuelve a
      # recomprimir. Es lo mismo que hacía Vercel con su Data Cache, que
      # también persiste entre despliegues.
      - next_cache:/app/.next/cache
      # El certificado y la clave de ARCA, de `secretos/arca/` en el servidor
      # y en solo lectura. Nunca entran en la imagen: `.dockerignore` deja
      # `secretos/` afuera. Solo esta subcarpeta: la configuración de rclone,
      # que da acceso a los respaldos, no tiene por qué verla la aplicación.
      - ./secretos/arca:/run/secrets/arca:ro
    # **Sin `ports`.** Solo Caddy le habla a la aplicación, por la red interna.
    # Si el puerto estuviera publicado, cualquiera podría saltearse Caddy y
    # mandar el `X-Forwarded-For` que quisiera, y el límite de frecuencia
    # contaría contra la IP que el atacante eligiera.
    expose:
      - "3000"
    # `docker stop` manda SIGTERM y Next termina lo que tiene en curso —los
    # pedidos abiertos y lo pendiente de `after()`, como el aviso de una
    # venta— antes de salir. Diez segundos, el valor por omisión, pueden no
    # alcanzar para un correo que tarda.
    stop_grace_period: 30s
    healthcheck:
      # `robots.txt` es estático: contesta si el servidor está vivo sin tocar
      # la base.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # **El backend en Go** (backend/, docs/go/PLAN.md). Una sola imagen con un
  # binario, `mjbj`, que cada servicio corre con su papel. Distroless: sin
  # shell, sin paquetes, unos 20 MB.
  #
  # La API atiende /api/v1 (y /api/vivo, el tiempo real) detrás de Caddy, y la
  # aplicación de Next le pide los datos por la red interna. Sin `ports`, como
  # la aplicación: solo Caddy y Next le hablan.
  api:
    build:
      context: ./backend
    image: mjbj-go:${GIT_SHA:-local}
    command: ["api"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.produccion
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "off"
      CARPETA_SUBIDAS: /datos/subidas
      # Los adjuntos de WhatsApp: los sirve /api/whatsapp/medios/<id>, con sesión.
      CARPETA_PRIVADA: /datos/privado
      # El correo de la app (servicio `correo`), igual que en `app`: sin esto
      # internal/email cae en el proveedor de demostración (tanda 10: avisos,
      # campañas y reintentos salen de acá).
      SMTP_HOST: ${SMTP_HOST:-correo}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_NOMBRE_TLS: ${SMTP_NOMBRE_TLS:-mail.${CORREO_DOMINIO:-${DOMINIO}}}
      # El certificado de ARCA (tanda 7: el CAE lo pide Go). Los mismos archivos
      # que `app`; ARCA_CUIT y ARCA_AMBIENTE vienen de .env.produccion.
      ARCA_CERTIFICADO_ARCHIVO: /run/secrets/arca/arca.crt
      ARCA_CLAVE_PRIVADA_ARCHIVO: /run/secrets/arca/arca.key
    volumes:
      - subidas:/datos/subidas
      - privado:/datos/privado
      # Solo lectura; el usuario de la imagen (nonroot, 65532) tiene que poder leerlos.
      - ./secretos/arca:/run/secrets/arca:ro
    expose:
      - "8080"
    # **Solo en loopback**, como la base: para que el build de la aplicación
    # (que corre con la red del host) le pida lo público. Desde afuera no se
    # llega; Caddy y Next le hablan por la red interna.
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/mjbj", "salud", "http://127.0.0.1:8080/salud"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # La cola de trabajos y las tareas periódicas que ya son de Go. Le avisa a
  # Next qué volver a armar (next.revalidar) por la red interna.
  worker:
    image: mjbj-go:${GIT_SHA:-local}
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.produccion
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "off"
      NEXT_URL: http://app:3000
      CARPETA_SUBIDAS: /datos/subidas
      # El worker baja los adjuntos que mandan los clientes por WhatsApp.
      CARPETA_PRIVADA: /datos/privado
      # El correo de la app (servicio `correo`), igual que en `app`: sin esto
      # internal/email cae en el proveedor de demostración (tanda 10: avisos,
      # campañas y reintentos salen de acá).
      SMTP_HOST: ${SMTP_HOST:-correo}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_NOMBRE_TLS: ${SMTP_NOMBRE_TLS:-mail.${CORREO_DOMINIO:-${DOMINIO}}}
    volumes:
      - subidas:/datos/subidas
      - privado:/datos/privado
    stop_grace_period: 30s

  # Las migraciones, con goose (backend/db/migraciones; la primera vez adopta
  # las 79 de drizzle). Como el migrador viejo: el perfil `herramientas` hace
  # que `up` lo ignore, y se usa con `run --rm`.
  migrar:
    profiles: ["herramientas"]
    image: mjbj-go:${GIT_SHA:-local}
    command: ["migrar"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "off"

  # Los scripts de mudanza en TypeScript (scripts/mudar-subidas.ts). Las
  # migraciones ya no corren acá: las hace `migrar`, con goose. No queda
  # corriendo: el perfil `herramientas` hace que `up` lo ignore.
  migrador:
    profiles: ["herramientas"]
    build:
      context: .
      target: migrador
    image: mjbj-migrador:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.produccion
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "off"
      CARPETA_SUBIDAS: /datos/subidas
      CARPETA_PRIVADA: /datos/privado
    volumes:
      - subidas:/datos/subidas
      - privado:/datos/privado

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Si el firewall no deja pasar UDP 443, el navegador vuelve solo
      # a HTTP/2.
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env.produccion}
      # Los nombres que redirigen al principal, separados por espacio.
      REDIRIGIDOS: www.${DOMINIO}${DOMINIO_ALTERNATIVO:+ ${DOMINIO_ALTERNATIVO} www.${DOMINIO_ALTERNATIVO}}
      # El dominio de las casillas (`mail.`, `correo.`, `autoconfig.`). Es
      # el del sitio salvo que se diga otro: así el correo se puede montar en
      # `mjbj.com.ar` mientras el sitio sigue en una dirección de prueba.
      CORREO_DOMINIO: ${CORREO_DOMINIO:-${DOMINIO}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # El mapa de redirecciones del sitio viejo (ver Caddyfile).
      - ./servidor/caddy/sitio-viejo.caddy:/etc/caddy/sitio-viejo.caddy:ro
      # La misma carpeta que escribe la aplicación: las fotos las sirve Caddy
      # directamente, sin pasar por Node.
      - subidas:/datos/subidas:ro
      - caddy_data:/data
      - caddy_config:/config
      # El registro de acceso queda en el disco del servidor, donde lo lee
      # fail2ban.
      - /var/log/caddy:/var/log/caddy

  respaldo:
    # La misma que `db`: `pg_dump` tiene que ser de la versión de la base.
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
      RESPALDO_DIAS: ${RESPALDO_DIAS:-14}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_DIAS: ${RCLONE_DIAS:-90}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ./respaldos:/respaldos
      - ./scripts/respaldo.sh:/respaldo.sh:ro
      # Las fotos subidas desde el panel y los adjuntos de WhatsApp, también
      # en solo lectura. La base guarda dónde están, no los archivos: sin
      # estos dos, una base restaurada muestra fichas sin fotos y
      # conversaciones con los adjuntos rotos.
      - subidas:/archivos/subidas:ro
      - privado:/archivos/privado:ro
      # La configuración de rclone, si hay copia fuera de la máquina. Va con
      # escritura porque algunos destinos renuevan el token ahí adentro.
      - ./secretos/rclone:/config/rclone
    entrypoint: ["sh", "/respaldo.sh"]

  # No hay contenedor `cron`: las tareas programadas y la cola las corre el
  # worker de Go (servicio `worker`), con el candado de «una vez por período»
  # en la base. El de antes le pegaba a /api/tareas de Next, que ya no existe.

  # **Las casillas de correo propias** (Stalwart: SMTP, IMAP, DKIM, filtro de
  # spam y bloqueo de IP que prueban claves, en un solo proceso). Es la pieza
  # que más cuidado pide de todo el servidor —ver «Correo propio» en
  # docs/SERVIDOR-PROPIO.md antes de encenderla—, por eso va en un perfil:
  # solo levanta con `COMPOSE_PROFILES=correo` en `.env.produccion`. Sin eso,
  # el resto del servidor anda igual.
  #
  # La configuración (dominio, casillas, puertos, certificado) no está en un
  # archivo: vive en la base de Stalwart y la escribe `scripts/correo.sh`.
  correo:
    profiles: ["correo"]
    image: stalwartlabs/stalwart:v0.16.26
    # El nombre con que se presenta a los otros servidores. Tiene que coincidir
    # con el registro A de `mail`, con el PTR de la IP (lo configura Hostinger)
    # y con el certificado: si no, Gmail lo trata como sospechoso.
    hostname: mail.${CORREO_DOMINIO:-${DOMINIO}}
    init: true
    restart: unless-stopped
    environment:
      # Solo durante `scripts/correo.sh iniciar` (la primera vez): un
      # administrador temporal para la instalación. Después queda vacío.
      STALWART_RECOVERY_ADMIN: ${CORREO_RECUPERACION:-}
    # **Publicados a internet, a diferencia de la aplicación.** 25 para
    # recibir de otros servidores, 465 y 587 para que las personas manden, 993
    # para leer. El panel de administración (8080) solo en la máquina: se
    # entra con un túnel SSH.
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "127.0.0.1:8081:8080"
    volumes:
      - correo_etc:/etc/stalwart
      - correo_datos:/var/lib/stalwart
      # El certificado de `mail.<dominio>` lo saca y lo renueva Caddy (bloque
      # `mail.` del Caddyfile) y Stalwart lo lee de su volumen. Lo recarga el
      # worker una vez por día (tarea `correo.certificado`).
      - caddy_data:/srv/caddy:ro
    # Termina de entregar lo que tiene en curso antes de cortar.
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz/live"]
      interval: 1m
      timeout: 5s
      start_period: 1m
      retries: 3
    networks:
      default:
        # Dentro de Docker, `mail.<dominio>` es este contenedor. El webmail se
        # conecta por ese nombre y el certificado coincide, así que la conexión
        # interna también va verificada.
        aliases:
          - mail.${CORREO_DOMINIO:-${DOMINIO}}

  # El webmail: leer y mandar desde el navegador, en `correo.<dominio>`. Es
  # el binario de Go del backend (`backend/`, ver docs/go/PLAN.md) con la SPA
  # adentro; habla con el servidor de correo de arriba por IMAP y SMTP, con la
  # misma casilla y clave de quien entra. No tiene base propia: la sesión es
  # una cookie sellada con CORREO_CLAVE.
  correo-web:
    profiles: ["correo"]
    build:
      context: ./backend
    image: mjbj-go:${GIT_SHA:-local}
    command: ["correo"]
    restart: unless-stopped
    depends_on:
      - correo
    environment:
      CORREO_IMAP: mail.${CORREO_DOMINIO:-${DOMINIO}}:993
      CORREO_SMTP: mail.${CORREO_DOMINIO:-${DOMINIO}}
      CORREO_PUERTO_SMTP: "587"
      CORREO_NOMBRE_TLS: mail.${CORREO_DOMINIO:-${DOMINIO}}
      # 32 bytes en base64 (`openssl rand -base64 32`). Sin ella el servicio
      # no arranca, a propósito. Cambiarla cierra todas las sesiones.
      CORREO_CLAVE: ${CORREO_CLAVE:-}
    healthcheck:
      test: ["CMD", "/mjbj", "salud", "http://127.0.0.1:8090/salud"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    expose:
      - "8090"

volumes:
  pgdata:
  subidas:
  privado:
  next_cache:
  caddy_data:
  caddy_config:
  correo_etc:
  correo_datos:
