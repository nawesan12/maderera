# Quién anda tanteando rutas que en este sitio no existen.
#
# Lee el registro de acceso de Caddy (JSON, una línea por pedido) y marca los
# pedidos a las rutas que el `Caddyfile` contesta con 404 sin despertar a la
# aplicación: WordPress, `.env`, `.git`, phpMyAdmin, cualquier `.php`. Nadie
# que use el sitio de verdad pide eso; un robot que busca una puerta pide
# decenas en un minuto.
#
# `client_ip` es la IP real: Caddy no confía en el `X-Forwarded-For` que trae
# el cliente. La fecha la encuentra fail2ban solo (es ISO 8601, en "ts").
#
# Se instala con: sudo cp servidor/fail2ban/filter.d/caddy-sondas.conf /etc/fail2ban/filter.d/
# Se prueba con: sudo fail2ban-regex /var/log/caddy/acceso.log caddy-sondas

[Definition]
failregex = ^.*"client_ip":"<HOST>".*"uri":"(?:/wp-(?:admin|login\.php|content|includes)|/xmlrpc\.php|/wordpress|/\.env|/\.git|/\.aws|/\.ssh|/phpmyadmin|/pma|/cgi-bin/|/vendor/phpunit/|/server-status|/actuator|[^"?]*\.php)[^"]*".*"status":404
ignoreregex =
